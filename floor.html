<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12140F">
<title>Die Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12140F;--panel:#1E2119;--panel2:#282C22;--steel:#9AA39B;--chalk:#EDEDE6;
--dim:#8C9187;--yellow:#F2C200;--red:#D6252A;--green:#2FA84F;--amber:#E8873B;
--paper:#E8E4D9;--paperInk:#23261F;--line:#3A3F33;--r:4px;
--disp:"Barlow Condensed",Impact,sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;
--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);overflow:hidden;user-select:none}
#andon{position:fixed;inset:0;pointer-events:none;z-index:60;border:10px solid transparent;transition:border-color .25s,box-shadow .25s}
body[data-lamp=idle] #andon{border-color:#3A3F33}
body[data-lamp=running] #andon{border-color:var(--green);box-shadow:inset 0 0 60px rgba(47,168,79,.22)}
body[data-lamp=paused] #andon{border-color:var(--amber);box-shadow:inset 0 0 60px rgba(232,135,59,.22)}
body[data-lamp=alert] #andon{border-color:var(--red);box-shadow:inset 0 0 60px rgba(214,37,42,.25)}
body[data-lamp=ok] #andon{border-color:var(--green);box-shadow:inset 0 0 90px rgba(47,168,79,.4)}
body[data-lamp=office] #andon{border-color:#B9B3A3}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
body[data-lamp=paused] #andon{animation:pulse 1.6s ease-in-out infinite}
#app{height:100%;display:flex;flex-direction:column}
header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:26px;height:26px;display:block;flex:0 0 auto;border-radius:50%}
.brand span{font-family:var(--disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--steel)}
.brand b{color:var(--yellow)}
.spacer{flex:1}
.chip{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:6px 9px;border:1px solid var(--line);
border-radius:var(--r);color:var(--dim);background:var(--panel2);cursor:pointer;white-space:nowrap}
.chip.on{color:var(--ink);background:var(--yellow);border-color:var(--yellow)}
.chip.bad{color:#F08A8D;border-color:#5A2020}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
.dot.off{background:var(--red)}.dot.wait{background:var(--amber)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px;-webkit-overflow-scrolling:touch}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(24px,4vw,38px);letter-spacing:.03em;text-transform:uppercase;margin:0 0 4px}
.eyebrow{font-family:var(--disp);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;border:none;
border-radius:var(--r);cursor:pointer;font-family:var(--disp);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
padding:26px 18px;font-size:26px;line-height:1;color:var(--ink);transition:transform .06s,filter .12s}
.btn:active{transform:scale(.985);filter:brightness(1.1)}
.btn small{font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:.02em;text-transform:none;opacity:.72}
.btn.scan{background:var(--yellow);padding:38px 18px;font-size:34px}
.btn.go{background:var(--green);color:#06210F;padding:38px 18px;font-size:34px}
.btn.stop{background:var(--red);color:#fff;padding:38px 18px;font-size:34px}
.btn.hold{background:var(--amber);color:#22120A}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-size:17px;padding:15px}
.btn.ghost:active{color:var(--chalk)}
.btn svg{width:34px;height:34px}
.row{display:grid;gap:12px}.row.two{grid-template-columns:1fr 1fr}
@media(max-width:560px){.row.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.card .code{font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.03em;color:var(--yellow);line-height:1.1}
.card .name{font-family:var(--disp);font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.card .sub{font-size:14px;color:var(--dim);margin-top:2px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 7px;border-radius:2px;letter-spacing:.04em;margin-top:8px}
.tag.g{background:rgba(47,168,79,.18);color:#7BD996}
.tag.a{background:rgba(232,135,59,.18);color:#F0A972}
.tag.n{background:var(--panel2);color:var(--dim)}
.stage{font-family:var(--disp);font-size:clamp(22px,3.6vw,32px);font-weight:700;text-transform:uppercase;letter-spacing:.03em;
color:var(--chalk);border-left:5px solid var(--yellow);padding-left:14px;margin:18px 0}
.big{font-family:var(--mono);font-size:clamp(32px,6.5vw,56px);font-weight:700;line-height:1}
.runitem{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--panel);border:1px solid var(--line);
border-left:5px solid var(--green);border-radius:var(--r);cursor:pointer;margin-bottom:10px}
.runitem.p{border-left-color:var(--amber)}.runitem:active{background:var(--panel2)}
.runitem .t{flex:1;min-width:0}
.runitem .dc{font-family:var(--mono);font-size:21px;color:var(--yellow);font-weight:700}
.runitem .sb{font-size:13.5px;color:var(--dim)}
.runitem .el{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--steel)}
#video{width:100%;max-height:42vh;background:#000;border-radius:var(--r);object-fit:cover;display:block}
.reticle{position:relative}
.reticle::after{content:"";position:absolute;inset:14%;border:3px solid var(--yellow);border-radius:var(--r);
box-shadow:0 0 0 9999px rgba(18,20,15,.45);pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.pad button{font-family:var(--mono);font-size:26px;font-weight:600;padding:16px 0;background:var(--panel2);color:var(--chalk);
border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.pad button:active{background:var(--yellow);color:var(--ink)}
.pad button.alpha{color:var(--yellow)}
.pad button.ok{background:var(--green);color:#06210F;border-color:var(--green)}
.pad button.bad{color:var(--red);border-color:#5A2020}
.padout{font-family:var(--mono);font-size:36px;font-weight:700;letter-spacing:.14em;text-align:center;padding:12px;
background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:62px;color:var(--yellow)}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.op{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 12px;cursor:pointer;
text-align:left;color:var(--chalk);position:relative}
.op:active{background:var(--yellow);color:var(--ink)}
.op b{display:block;font-family:var(--disp);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;line-height:1.15}
.op i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
.op:active i{color:var(--ink);opacity:.65}
.op.sug{border-color:var(--green);border-width:2px;background:rgba(47,168,79,.1)}
.op.sug::after{content:"EXPECTED NEXT";position:absolute;top:-9px;right:8px;font-family:var(--mono);font-size:9px;
font-weight:700;letter-spacing:.08em;background:var(--green);color:#06210F;padding:2px 6px;border-radius:2px}
.op.done{opacity:.55}
.op.done::after{content:"DONE";position:absolute;top:-9px;right:8px;font-family:var(--mono);font-size:9px;font-weight:700;
letter-spacing:.08em;background:var(--panel2);color:var(--dim);padding:2px 6px;border-radius:2px;border:1px solid var(--line)}
.op.ideal{border-color:var(--green);border-width:2px;background:rgba(47,168,79,.1)}
.op.ideal::after{content:"IDEAL";position:absolute;top:-9px;right:8px;font-family:var(--mono);
font-size:9px;font-weight:700;letter-spacing:.08em;background:var(--green);color:#06210F;
padding:2px 6px;border-radius:2px}
.op.more{background:var(--panel2);border-style:dashed}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.reason{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:19px 14px;cursor:pointer;
text-align:center;color:var(--chalk)}
.reason:active{background:var(--amber);color:#22120A}
.reason span{display:block;font-family:var(--disp);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.reason em{display:block;font-style:normal;font-size:13px;color:var(--dim);margin-top:2px}
.reason:active em{color:#22120A;opacity:.7}
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.leader{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
padding:15px 10px;cursor:pointer;text-align:center;font-family:var(--disp);font-size:19px;
font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--chalk)}
.leader:active{background:var(--yellow);color:var(--ink)}
.leader.last{border-color:var(--yellow);color:var(--yellow)}
.flash{display:grid;place-items:center;text-align:center;min-height:52vh}
.flash svg{width:100px;height:100px}
body[data-side=office]{background:var(--paper);color:var(--paperInk)}
body[data-side=office] header{background:#DCD7C9;border-color:#BDB6A4}
body[data-side=office] .brand span{color:#5C6152}
body[data-side=office] .chip{background:#EFEBE0;border-color:#BDB6A4;color:#5C6152}
body[data-side=office] .chip.on{background:var(--paperInk);color:var(--paper);border-color:var(--paperInk)}
.tabs{display:flex;border-bottom:2px solid var(--paperInk);margin-bottom:16px;flex-wrap:wrap}
.tabs button{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
padding:10px 17px;background:none;border:none;cursor:pointer;color:#6D7263}
.tabs button.on{background:var(--paperInk);color:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:8px 10px;
border-bottom:1.5px solid var(--paperInk);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #C9C3B2;vertical-align:top}
td.m,th.m{font-family:var(--mono);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mcard{background:#F2EFE5;border:1px solid #BDB6A4;border-left:6px solid #9AA39B;border-radius:var(--r);padding:13px}
.mcard.run{border-left-color:var(--green)}.mcard.pau{border-left-color:var(--amber)}
.mcard h3{font-family:var(--disp);font-size:19px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.03em}
.mcard .k{font-family:var(--mono);font-size:11px;color:#6D7263}
.mcard .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:6px}
.obtn{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;
border:1.5px solid var(--paperInk);background:none;color:var(--paperInk);border-radius:var(--r);cursor:pointer}
.obtn:active{background:var(--paperInk);color:var(--paper)}
.obtn.pri{background:var(--paperInk);color:var(--paper)}
.obtn.dan{border-color:var(--red);color:var(--red)}
input{font-family:var(--mono);font-size:14px;padding:9px 10px;border:1.5px solid #BDB6A4;border-radius:var(--r);
background:#F7F5EE;color:var(--paperInk);width:100%}
label{display:block;font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6D7263;margin:12px 0 4px}
.note{font-size:13px;color:#6D7263;line-height:1.5;max-width:64ch}
.warn{background:rgba(214,37,42,.16);border-left:4px solid var(--red);padding:12px 14px;border-radius:var(--r);font-size:14px;margin-bottom:16px}
body[data-side=office] .warn{background:rgba(214,37,42,.1)}
.sp{height:14px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3A3F33;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-side="floor" data-lamp="idle">
<div id="andon"></div>
<div id="app">
  <header>
    <div class="brand"><img src="./logo.png" alt="" width="26" height="26"><span>Die&nbsp;<b>Tracker</b></span></div>
    <div class="spacer"></div>
    <div class="chip" id="netchip"><span class="dot" id="netdot"></span><span id="nettext">…</span></div>
    <div class="chip" id="langchip">EN / हिं</div>
  </header>
  <main id="main"><p class="eyebrow" style="padding:20px">Connecting…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="./core.js"></script>
<script>
/* OPERATOR TERMINAL. There is no route to the manager view from this page.
   Manager lives at ./manager.html

   ---------------------------------------------------------------------
   KEYPAD PASSWORD
   Typing a die code by hand bypasses the scan, so it is gated. The
   supervisor gives this out when a label is damaged or unreadable.

   CHANGE IT, then commit and bump CACHE in sw.js.

   Keep it to characters that exist on the pad: digits 0-9 and U, L, P.
   This is a deterrent, not security: it sits in JavaScript that anyone
   can read with View Source. It stops routine bypassing of the scanner,
   which is the actual goal.
   --------------------------------------------------------------------- */
const KEYPAD_PASSWORD  = "2580";
const KEYPAD_GRACE_MIN = 3;      // minutes before it asks again
let padUnlockUntil = 0;
let leaderChosen = false;   // the app opens on the Project Leader picker
/* ============================ SCANNER ============================ */
async function startCam(){
  stopCam();
  const vid=document.getElementById("video"); if(!vid) return;
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}}); }
  catch(e){ return softErr("Camera blocked. Needs https and permission. Use TYPE CODE."); }
  track=stream; vid.srcObject=stream; try{ await vid.play(); }catch(e){}
  if("BarcodeDetector" in window){
    try{
      detector=new window.BarcodeDetector({formats:["qr_code","code_128","data_matrix","code_39","ean_13"]});
      scanLoop=setInterval(async()=>{
        if(!detector||!vid.videoWidth) return;
        try{const h=await detector.detect(vid); if(h&&h.length){const v=h[0].rawValue.trim();stopCam();onScan(v)}}catch(_){}
      },300);
      return;
    }catch(e){ detector=null; }
  }
  if(window.ZXing){
    try{
      zx=new ZXing.BrowserMultiFormatReader();
      zx.decodeFromStream(stream,vid,(res)=>{ if(res){const v=res.getText().trim();stopCam();onScan(v)} });
      return;
    }catch(e){}
  }
  softErr("Scanner unavailable on this device. Use TYPE CODE.");
}
function stopCam(){
  clearInterval(scanLoop); scanLoop=null; detector=null;
  if(zx){try{zx.reset()}catch(e){} zx=null;}
  if(track){track.getTracks().forEach(t=>t.stop()); track=null;}
}
function setErr(m){V.err=m;render()}
/* camera problems must not overwrite a more useful message already on screen */
function softErr(m){ if(!V.err) V.err=m; render(); }

/* ============================ FLOW ============================ */
function onScan(raw){
  V.err=null;
  const d=dieBy(raw);
  if(d) return pickDie(d);
  if(machineBy(raw)){ V.err=(lang==="en"?"Scan the DIE first.":"पहले डाई स्कैन करें।");
    V.view="scan"; return render(); }
  const set=diesInSet(raw);
  if(set.length){ V.setList=set; V.setNo=norm(raw); V.view="setpick"; return render(); }
  V.err=(lang==="en"?"Code not recognised: ":"कोड नहीं मिला: ")+raw; V.view="scan"; render();
}

function pickDie(d){
  V.die=d; V.mach=null; V.pickN=null; V.showOthers=false; V.showAllMach=false; V.target=null;
  const run=runningElsewhere(d.code);
  if(run){ V.mach=run.m; V.view="running"; return render(); }
  V.view="operation"; render();
}
function chooseOp(n){
  V.pickN=Number(n);
  if(!needsMachine(V.pickN)){
    const na=machineBy(NA_MACHINE);
    if(!na){ V.err="Machine code "+NA_MACHINE+" (NA) is missing from the database."; return render(); }
    V.mach=na; V.view="confirm"; return render();
  }
  V.target="machine"; V.showAllMach=false; V.view="machine"; render();
}
function chooseMachine(code){
  const m=machineBy(code);
  if(!m){ V.err="Machine not found: "+code; V.view="machine"; return render(); }
  const busy=isMultiDie(m.code)?null:runOf(m.code);
  if(busy && m.code!==NA_MACHINE){
    V.err=m.code+" "+m.name+" is already running "+busy.die+". Finish that first.";
    V.view="machine"; return render();
  }
  V.mach=m; V.target=null; V.view="confirm"; render();
}
function doStart(){
  const other=runningElsewhere(V.die.code);
  if(other){ V.err="Die "+V.die.code+" is already running on "+other.m.code+" "+other.m.name+".";
    V.view="operation"; return render(); }
  pushEvent({type:"START",die:V.die.code,machine:V.mach.code,stage:V.pickN,
             sug:suggestStage(V.die.code)});
  flash("start",V.pickN);
}
function doEnd(){
  const r=runOfDie(V.die.code); if(!r)return;
  if(r.paused) pushEvent({type:"RESUME",die:r.die,machine:V.mach.code,stage:r.stage});
  pushEvent({type:"END",die:r.die,machine:V.mach.code,stage:r.stage});
  flash("end",r.stage);
}
function doPause(x){
  const r=runOfDie(V.die.code); if(!r)return;
  pushEvent({type:"PAUSE",die:r.die,machine:V.mach.code,stage:r.stage,reason:x.id+" "+x.en});
  flash("pause",r.stage);
}
function doResume(){
  const r=runOfDie(V.die.code); if(!r)return;
  pushEvent({type:"RESUME",die:r.die,machine:V.mach.code,stage:r.stage});
  V.view="running";render();
}
function flash(kind,n){
  V.flash={kind,stage:n,die:V.die.code,mach:V.mach.code+" "+V.mach.name};
  V.view="flash";render();
  setTimeout(()=>{V.mach=null;V.die=null;V.target=null;V.flash=null;V.showOthers=false;V.view="home";render()},2400);
}
function home(){stopCam();camTried=false;V={...V,view:"home",mach:null,die:null,target:null,pad:"",err:null,showOthers:false};render()}
function lamp(){
  if(side==="office")return"office";
  if(V.view==="flash")return V.flash.kind==="pause"?"paused":"ok";
  if(V.err||dbErr)return"alert";
  if(V.view==="running"&&V.die){const r=runOfDie(V.die.code);return r&&r.paused?"paused":"running"}
  const a=openRuns();
  if(a.some(x=>x.r.paused))return"paused";
  return a.length?"running":"idle";
}


function render(){
  let body;
  if(ready && !leaderChosen && V.view!=="oper"){ V.view="oper"; }
  try{
    document.body.dataset.lamp=lamp();
    body=ready?floor():`<p class="eyebrow">Connecting…</p>
      <div class="warn">${esc(dbErr||"Contacting database")}</div>`;
  }catch(e){
    console.error("render failed",e);
    V.view="home"; V.die=null; V.mach=null; V.pickN=null; V.target=null;
    body=`<div class="warn">Something went wrong: ${esc(e.message)}<br>Returned to the start.</div>`
      +floor();
  }
  document.getElementById("main").innerHTML=body;
  paintNet(); bind();
}
const dieCard=d=>`<div class="card"><div class="code">${esc(d.code)}</div>
  <div class="name">${esc(d.part||"—")}</div><div class="sub">${esc(d.operation||"")}</div></div>`;
const machCard=m=>`<div class="card"><div class="code">${esc(m.code)}</div>
  <div class="name">${esc(m.name)}</div><div class="sub">${lang==="en"?"Machine":"मशीन"}</div></div>`;

function floor(){
  const err=(V.err||dbErr)?`<div class="warn">${esc(V.err||("Database: "+dbErr))}</div>`:"";
  if(V.view==="home"){
    const runs=openRuns();
    return err+`<p class="eyebrow">${esc(operator)} · ${runs.length} ${lang==="en"?"in progress":"चल रहे"}</p>
      <button class="btn scan" data-a="scan">${ICON.scan}${t("scan")}<small>${t("needDie")}</small></button>
      <div class="sp"></div><p class="eyebrow">${t("running")}</p>
      ${runs.length?runs.map(x=>`<div class="runitem ${x.r.paused?"p":""}" data-a="opendie" data-d="${esc(x.r.die)}">
        <div class="t"><div class="dc">${esc(x.r.die)}</div>
        <div class="sb">${esc(x.m.code)} ${esc(x.m.name)} · ${esc(stageName(x.r.stage))}</div></div>
        <div style="text-align:right"><div class="el">${el(Date.now()-x.r.ts)}</div>
        <span class="tag ${x.r.paused?"a":"g"}">${x.r.paused?t("onhold"):"RUN"}</span></div></div>`).join("")
        :`<div class="card"><div class="sub">${t("nothing")}</div></div>`}
      <div class="sp"></div><div class="row two">
        <button class="btn ghost" data-a="oper">${t("changeLeader")}</button>
        <button class="btn ghost" data-a="pad">${ICON.key} ${t("keypad")}<small>${lang==="en"?"needs supervisor code":"सुपरवाइज़र कोड चाहिए"}</small></button></div>`;
  }
  if(V.view==="scan"){
    const need=t("needDie");
    return err+`<h1>${esc(need)}</h1>
      <p class="eyebrow">${V.mach?esc(V.mach.code+" "+V.mach.name)+" · ":""}${V.die?esc(V.die.code):""}</p>
      <div class="reticle"><video id="video" playsinline muted></video></div>
      <div class="sp"></div><div class="row two">
        <button class="btn ghost" data-a="pad">${ICON.key} ${t("keypad")}</button>
        <button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button></div>`;
  }
  if(V.view==="padlock"){
    const keys=["1","2","3","4","5","6","7","8","9","U","0","L","P","C","OK"];
    return `<h1>${lang==="en"?"Supervisor code":"सुपरवाइज़र कोड"}</h1>
      <p class="eyebrow">${lang==="en"
        ?"Typing a code by hand needs permission. Ask the supervisor."
        :"हाथ से कोड डालने के लिए अनुमति चाहिए। सुपरवाइज़र से पूछें।"}</p>
      ${V.pwErr?`<div class="warn">${lang==="en"?"Wrong code.":"गलत कोड।"}</div>`:""}
      <div class="padout">${(V.pw||"").replace(/./g,"\u2022")||"—"}</div>
      <div class="pad">${keys.map(k=>`<button class="${k==="OK"?"ok":(k==="C"?"bad":(/^[A-Z]$/.test(k)?"alpha":""))}"
        data-a="pwkey" data-k="${k}">${k}</button>`).join("")}</div>
      <div class="sp"></div>
      <button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="pad"){
    const keys=["1","2","3","4","5","6","7","8","9","U","0","L","P","C","OK"];
    return err+`<h1>${t("keypad")}</h1>
      <p class="eyebrow">${lang==="en"?"Machine 101-113 · Die 5153U, or 5153 for the set":"मशीन 101-113 · डाई 5153U"}</p>
      <div class="padout">${V.pad?esc(V.pad):"—"}</div>
      <div class="pad">${keys.map(k=>`<button class="${k==="OK"?"ok":(k==="C"?"bad":(/^[A-Z]$/.test(k)?"alpha":""))}"
        data-a="key" data-k="${k}">${k}</button>`).join("")}</div>
      <div class="sp"></div><button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="setpick"){
    return err+`<p class="eyebrow">${esc(V.setNo)} · ${V.setList.length} ${lang==="en"?"elements":"पुर्ज़े"}</p>
      <h1>${lang==="en"?"Which element?":"कौन सा पुर्ज़ा?"}</h1>
      <div class="ops">${V.setList.map(d=>`<div class="op" data-a="pickelem" data-c="${esc(d.code)}">
        <i>${esc(d.code.replace(dieSetOf(d.code),"")||"—")}</i><b>${esc(d.code)}</b></div>`).join("")}</div>
      <div class="sp"></div>
      <p class="eyebrow">${esc(V.setList[0].part||"")}</p>
      <button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="operation"){
    if(!V.die){V.view="home";return floor()}
    const sug=suggestStage(V.die.code), list=V.showOthers?OTHERS():PRIMARY();
    return err+`<p class="eyebrow">${esc(V.die.code)} · ${esc(V.die.part||"")}</p>
      <h1>${t("whichOp")}</h1><div class="ops">
      ${list.map(s=>{const done=stageDone(V.die.code,s.n);
        const cls=(!V.showOthers&&s.n===sug?"sug ":"")+(done?"done":"");
        const nm=needsMachine(s.n)?"":(lang==="en"?" · no m/c":" · मशीन नहीं");
        return `<div class="op ${cls}" data-a="op" data-n="${s.n}"><i>${s.n<10?"0"+s.n:s.n}${nm}</i><b>${esc(s.name)}</b></div>`}).join("")}
      ${V.showOthers?`<div class="op more" data-a="less"><i>&nbsp;</i><b>${ICON.back} ${t("back")}</b></div>`
        :`<div class="op more" data-a="more"><i>11-15</i><b>${t("others")}</b></div>`}</div>
      <div class="sp"></div><button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="machine"){
    if(!V.die||!V.pickN){V.view="home";return floor()}
    const ideal=idealFor(V.pickN);
    const multi=MACHINES.filter(m=>isMultiDie(m.code)&&m.code!==NA_MACHINE);
    const tiles=(ideal.length&&!V.showAllMach)
      ? ideal.map(c=>machineBy(c)).filter(Boolean).concat(multi)
      : MACHINES.filter(m=>m.code!==NA_MACHINE);
    return err+`<p class="eyebrow">${esc(V.die.code)} · ${V.pickN} ${esc(stageName(V.pickN))}</p>
      <h1>${lang==="en"?"Which machine?":"कौन सी मशीन?"}</h1>
      <div class="ops">
        ${tiles.map(m=>{
          const multiM=isMultiDie(m.code), busy=multiM?null:runOf(m.code);
          const n=multiM?runsOn(m.code).length:0;
          const cls=(ideal.length&&ideal.includes(m.code)?"ideal ":"")+(busy?"done":"");
          const note=multiM?(n?` · ${n} ${lang==="en"?"dies":"डाई"}`:"")
                           :(busy?` · ${lang==="en"?"busy":"व्यस्त"}`:"");
          return `<div class="op ${cls}" data-a="mach" data-c="${esc(m.code)}">
            <i>${esc(m.code)}${note}</i><b>${esc(m.name)}</b></div>`}).join("")}
        ${(ideal.length&&!V.showAllMach)
          ? `<div class="op more" data-a="allmach"><i>&nbsp;</i><b>${lang==="en"?"Other machine":"अन्य मशीन"}</b></div>`
          : (ideal.length?`<div class="op more" data-a="idealmach"><i>&nbsp;</i><b>${ICON.back} ${t("back")}</b></div>`:"")}
      </div>
      <div class="sp"></div>
      <button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="confirm"){
    if(!V.mach||!V.die){V.view="home";return floor()}
    const off=needsMachine(V.pickN)&&!isIdeal(V.pickN,V.mach.code);
    return err+(off?`<div class="warn"><b>${lang==="en"?"Unusual machine":"असामान्य मशीन"}</b><br>
      ${esc(V.mach.code)} ${esc(V.mach.name)} ${lang==="en"
        ?"is not normally used for this operation. You can still start."
        :"आम तौर पर इस काम के लिए नहीं है। फिर भी शुरू कर सकते हैं।"}</div>`:"")
      +`<p class="eyebrow">${lang==="en"?"Check, then start":"जाँचें, फिर शुरू करें"}</p>
      ${dieCard(V.die)}<div class="sp"></div>${machCard(V.mach)}
      ${!needsMachine(V.pickN)?`<p class="eyebrow" style="margin-top:10px">${lang==="en"
        ?"No machine needed for this operation":"इस काम के लिए मशीन नहीं चाहिए"}</p>`:""}
      <div class="stage">${V.pickN} · ${esc(stageName(V.pickN))}</div>
      <button class="btn go" data-a="confirmstart">${ICON.play}${t("start")}</button>
      <div class="sp"></div><button class="btn ghost" data-a="backop">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="running"){
    if(!V.mach||!V.die){V.view="home";return floor()}
    const r=runOfDie(V.die.code);
    if(!r){V.view="home";return floor()}
    return err+`<p class="eyebrow">${esc(V.mach.code)} ${esc(V.mach.name)}</p>${dieCard(V.die)}
      <div class="stage">${r.stage} · ${esc(stageName(r.stage))}</div>
      ${r.paused?`<span class="tag a">${t("onhold")} · ${esc(r.reason||"")}</span>`:""}
      <p class="eyebrow" style="margin:14px 0 2px">${lang==="en"?"Elapsed":"बीता समय"}</p>
      <div class="big">${el(Date.now()-r.ts)}</div><div class="sp"></div>
      ${r.paused?`<button class="btn go" data-a="resume">${ICON.play}${t("resume")}</button>`
        :`<button class="btn stop" data-a="end">${ICON.stop}${t("end")}</button><div class="sp"></div>
          <button class="btn hold" data-a="pausemenu">${ICON.pause}${t("pause")}</button>`}
      <div class="sp"></div><button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="pausemenu"){
    if(!V.die||!V.mach){V.view="home";return floor()}
    return `<h1>${t("why")}</h1><p class="eyebrow">${esc(V.die.code)} · ${esc(V.mach.name)}</p>
      <div class="reasons">${REASONS.map((r,i)=>`<div class="reason" data-a="reason" data-i="${i}">
        <span>${esc(r.en)}</span><em>${esc(r.hi)}</em></div>`).join("")}</div>
      <div class="sp"></div><button class="btn ghost" data-a="back-run">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="oper"){
    const last=LS.get("dt:op");
    return `<h1>${t("whoLeader")}</h1>
      <p class="eyebrow">${leaderChosen?t("changeLeader")
        :(lang==="en"?"Select before starting work":"काम शुरू करने से पहले चुनें")}</p>
      <div class="leaders">${OPERATORS.map(o=>`<div class="leader${o===last?" last":""}"
        data-a="setoper" data-o="${esc(o)}">${esc(o)}</div>`).join("")}</div>
      ${leaderChosen?`<div class="sp"></div>
        <button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`:""}`;
  }
  if(V.view==="flash"){
    const f=V.flash,col=f.kind==="pause"?"var(--amber)":"var(--green)";
    const word=f.kind==="start"?(lang==="en"?"Started":"शुरू"):f.kind==="end"?(lang==="en"?"Finished":"पूरा")
      :(lang==="en"?"On hold":"रुका");
    return `<div class="flash"><div><div style="color:${col}">${ICON.tick}</div>
      <h1 style="margin-top:10px">${word}</h1>
      <div style="font-family:var(--mono);font-size:30px;color:var(--yellow);font-weight:700">${esc(f.die)}</div>
      <div style="font-size:16px;color:var(--dim);margin-top:4px">${esc(f.mach)} · ${f.stage} ${esc(stageName(f.stage))}</div>
      </div></div>`;
  }
  return "";
}

function bind(){
  document.querySelectorAll("[data-a]").forEach(n=>n.onclick=()=>act(n.dataset));
  if(V.view==="scan"&&!track&&!camTried){ camTried=true; startCam(); }
}
async function act(d){
  const a=d.a;
  if(a!=="key") V.err=null;
  switch(a){
    case "scan":V.target=null;camTried=false;V.view="scan";render();break;
    case "pad":
      stopCam();
      if(Date.now()<padUnlockUntil){ V.pad=""; V.view="pad"; }
      else { V.pw=""; V.pwErr=false; V.view="padlock"; }
      render(); break;
    case "home":home();break;
    case "opendie":pickDie(dieBy(d.d));break;
    case "pickelem":pickDie(dieBy(d.c));break;
    case "mach":chooseMachine(d.c);break;
    case "allmach":V.showAllMach=true;render();break;
    case "idealmach":V.showAllMach=false;render();break;
    case "more":V.showOthers=true;render();break;
    case "less":V.showOthers=false;render();break;
    case "op":chooseOp(d.n);break;
    case "backop":V.target=null;V.view=needsMachine(V.pickN)?"machine":"operation";render();break;
    case "confirmstart":doStart();break;
    case "end":doEnd();break;
    case "pausemenu":V.view="pausemenu";render();break;
    case "back-run":V.view="running";render();break;
    case "reason":doPause(REASONS[+d.i]);break;
    case "resume":doResume();break;
    case "oper":V.view="oper";render();break;
    case "setoper":operator=d.o;LS.set("dt:op",operator);leaderChosen=true;home();break;
    case "pwkey":
      if(d.k==="C") V.pw=(V.pw||"").slice(0,-1);
      else if(d.k==="OK"){
        if((V.pw||"")===KEYPAD_PASSWORD){
          padUnlockUntil=Date.now()+KEYPAD_GRACE_MIN*60000;
          V.pw=""; V.pwErr=false; V.pad=""; V.view="pad";
        } else { V.pw=""; V.pwErr=true; }
      }
      else if((V.pw||"").length<12) V.pw=(V.pw||"")+d.k;
      render(); break;
    case "key":
      if(d.k==="C")V.pad=V.pad.slice(0,-1);
      else if(d.k==="OK"){const p=V.pad;V.pad="";if(p)return onScan(p)}
      else if(V.pad.length<12)V.pad+=d.k;
      render();break;
  }
}

document.getElementById("langchip").onclick=()=>{
  lang=lang==="en"?"hi":"en"; LS.set("dt:lang",lang);
  document.getElementById("langchip").classList.toggle("on",lang==="hi"); render()};
setInterval(()=>{ if(ready&&(V.view==="home"||V.view==="running")) render(); },30000);
window.addEventListener("pagehide",stopCam);
if("serviceWorker" in navigator)
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
connect();
</script>
</body>
</html>
