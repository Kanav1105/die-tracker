<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Die Tracker — Shop Floor Terminal v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12140F;--panel:#1E2119;--panel2:#282C22;--steel:#9AA39B;--chalk:#EDEDE6;
  --dim:#8C9187;--yellow:#F2C200;--red:#D6252A;--green:#2FA84F;--amber:#E8873B;
  --paper:#E8E4D9;--paperInk:#23261F;--line:#3A3F33;--r:4px;
  --disp:"Barlow Condensed",Impact,sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);overflow:hidden;user-select:none}
#andon{position:fixed;inset:0;pointer-events:none;z-index:60;border:10px solid transparent;
  transition:border-color .25s,box-shadow .25s}
body[data-lamp="idle"] #andon{border-color:#3A3F33}
body[data-lamp="running"] #andon{border-color:var(--green);box-shadow:inset 0 0 60px rgba(47,168,79,.22)}
body[data-lamp="paused"] #andon{border-color:var(--amber);box-shadow:inset 0 0 60px rgba(232,135,59,.22)}
body[data-lamp="alert"] #andon{border-color:var(--red);box-shadow:inset 0 0 60px rgba(214,37,42,.25)}
body[data-lamp="ok"] #andon{border-color:var(--green);box-shadow:inset 0 0 90px rgba(47,168,79,.4)}
body[data-lamp="office"] #andon{border-color:#B9B3A3}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
body[data-lamp="paused"] #andon{animation:pulse 1.6s ease-in-out infinite}
#app{height:100%;display:flex;flex-direction:column}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-size:15px;color:var(--steel)}
.brand b{color:var(--yellow)}
.spacer{flex:1}
.chip{font-family:var(--mono);font-size:12px;font-weight:600;padding:6px 10px;
  border:1px solid var(--line);border-radius:var(--r);color:var(--dim);background:var(--panel2);cursor:pointer}
.chip.on{color:var(--ink);background:var(--yellow);border-color:var(--yellow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.dot.off{background:var(--red)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px;-webkit-overflow-scrolling:touch}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(24px,4vw,38px);letter-spacing:.03em;
  text-transform:uppercase;margin:0 0 4px}
.eyebrow{font-family:var(--disp);font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);margin:0 0 14px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;
  border:none;border-radius:var(--r);cursor:pointer;font-family:var(--disp);font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:26px 18px;font-size:26px;line-height:1;
  color:var(--ink);transition:transform .06s,filter .12s}
.btn:active{transform:scale(.985);filter:brightness(1.1)}
.btn small{font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:.02em;
  text-transform:none;opacity:.72}
.btn.scan{background:var(--yellow);padding:40px 18px;font-size:34px}
.btn.go{background:var(--green);color:#06210F;padding:40px 18px;font-size:34px}
.btn.stop{background:var(--red);color:#fff;padding:40px 18px;font-size:34px}
.btn.hold{background:var(--amber);color:#22120A}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-size:17px;padding:16px}
.btn.ghost:active{color:var(--chalk)}
.btn svg{width:36px;height:36px}
.row{display:grid;gap:12px}
.row.two{grid-template-columns:1fr 1fr}
@media(max-width:560px){.row.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card .code{font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.03em;color:var(--yellow);line-height:1.1}
.card .name{font-family:var(--disp);font-size:21px;font-weight:600;text-transform:uppercase;
  letter-spacing:.03em;margin-top:2px}
.card .sub{font-size:14px;color:var(--dim);margin-top:2px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 7px;
  border-radius:2px;letter-spacing:.04em;margin-top:8px}
.tag.g{background:rgba(47,168,79,.18);color:#7BD996}
.tag.a{background:rgba(232,135,59,.18);color:#F0A972}
.tag.n{background:var(--panel2);color:var(--dim)}
.stage{font-family:var(--disp);font-size:clamp(22px,3.6vw,32px);font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;color:var(--chalk);border-left:5px solid var(--yellow);padding-left:14px;margin:18px 0}
.big{font-family:var(--mono);font-size:clamp(32px,6.5vw,56px);font-weight:700;line-height:1}
.runitem{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);
  border:1px solid var(--line);border-left:5px solid var(--green);border-radius:var(--r);
  cursor:pointer;margin-bottom:10px}
.runitem.p{border-left-color:var(--amber)}
.runitem:active{background:var(--panel2)}
.runitem .t{flex:1;min-width:0}
.runitem .el{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--steel)}
#video{width:100%;max-height:44vh;background:#000;border-radius:var(--r);object-fit:cover;display:block}
.reticle{position:relative}
.reticle::after{content:"";position:absolute;inset:14%;border:3px solid var(--yellow);
  border-radius:var(--r);box-shadow:0 0 0 9999px rgba(18,20,15,.45);pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.pad button{font-family:var(--mono);font-size:27px;font-weight:600;padding:17px 0;background:var(--panel2);
  color:var(--chalk);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.pad button:active{background:var(--yellow);color:var(--ink)}
.pad button.alpha{color:var(--yellow)}
.pad button.ok{background:var(--green);color:#06210F;border-color:var(--green)}
.padout{font-family:var(--mono);font-size:38px;font-weight:700;letter-spacing:.14em;text-align:center;
  padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  min-height:66px;color:var(--yellow)}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.op{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;
  cursor:pointer;text-align:left;color:var(--chalk);position:relative}
.op:active{background:var(--yellow);color:var(--ink)}
.op b{display:block;font-family:var(--disp);font-size:19px;font-weight:600;text-transform:uppercase;
  letter-spacing:.03em;line-height:1.15}
.op i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
.op:active i{color:var(--ink);opacity:.65}
.op.sug{border-color:var(--green);border-width:2px;background:rgba(47,168,79,.1)}
.op.sug::after{content:"EXPECTED NEXT";position:absolute;top:-9px;right:8px;font-family:var(--mono);
  font-size:9px;font-weight:700;letter-spacing:.08em;background:var(--green);color:#06210F;padding:2px 6px;border-radius:2px}
.op.done{opacity:.55}
.op.done::after{content:"DONE";position:absolute;top:-9px;right:8px;font-family:var(--mono);font-size:9px;
  font-weight:700;letter-spacing:.08em;background:var(--panel2);color:var(--dim);padding:2px 6px;
  border-radius:2px;border:1px solid var(--line)}
.op.more{background:var(--panel2);border-style:dashed}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.reason{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 14px;
  cursor:pointer;text-align:center;color:var(--chalk)}
.reason:active{background:var(--amber);color:#22120A}
.reason span{display:block;font-family:var(--disp);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.reason em{display:block;font-style:normal;font-size:13px;color:var(--dim);margin-top:2px}
.reason:active em{color:#22120A;opacity:.7}
.flash{display:grid;place-items:center;text-align:center;min-height:54vh}
.flash svg{width:104px;height:104px}
body[data-side="office"]{background:var(--paper);color:var(--paperInk)}
body[data-side="office"] header{background:#DCD7C9;border-color:#BDB6A4}
body[data-side="office"] .brand{color:#5C6152}
body[data-side="office"] .chip{background:#EFEBE0;border-color:#BDB6A4;color:#5C6152}
body[data-side="office"] .chip.on{background:var(--paperInk);color:var(--paper);border-color:var(--paperInk)}
.tabs{display:flex;border-bottom:2px solid var(--paperInk);margin-bottom:18px;flex-wrap:wrap}
.tabs button{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:11px 18px;background:none;border:none;cursor:pointer;color:#6D7263}
.tabs button.on{background:var(--paperInk);color:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:left;
  padding:8px 10px;border-bottom:1.5px solid var(--paperInk);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #C9C3B2;vertical-align:top}
td.m,th.m{font-family:var(--mono);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.mcard{background:#F2EFE5;border:1px solid #BDB6A4;border-left:6px solid #9AA39B;border-radius:var(--r);padding:14px}
.mcard.run{border-left-color:var(--green)}
.mcard.pau{border-left-color:var(--amber)}
.mcard h3{font-family:var(--disp);font-size:19px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.03em}
.mcard .k{font-family:var(--mono);font-size:11px;color:#6D7263}
.mcard .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:6px}
.obtn{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 14px;border:1.5px solid var(--paperInk);background:none;color:var(--paperInk);
  border-radius:var(--r);cursor:pointer}
.obtn:active{background:var(--paperInk);color:var(--paper)}
.obtn.pri{background:var(--paperInk);color:var(--paper)}
.obtn.dan{border-color:var(--red);color:var(--red)}
input{font-family:var(--mono);font-size:14px;padding:9px 10px;border:1.5px solid #BDB6A4;
  border-radius:var(--r);background:#F7F5EE;color:var(--paperInk);width:100%}
label{display:block;font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:#6D7263;margin:12px 0 4px}
.note{font-size:13px;color:#6D7263;line-height:1.5;max-width:64ch}
.warn{background:rgba(214,37,42,.16);border-left:4px solid var(--red);padding:12px 14px;
  border-radius:var(--r);font-size:14px;margin-bottom:16px}
.sp{height:14px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3A3F33;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-side="floor" data-lamp="idle">
<div id="andon"></div>
<div id="app">
  <header>
    <div class="brand">Die&nbsp;<b>Tracker</b></div>
    <div class="spacer"></div>
    <div class="chip" id="netchip"><span class="dot" id="netdot"></span><span id="nettext">LOCAL</span></div>
    <div class="chip" id="langchip">EN / हिं</div>
    <div class="chip" id="sidechip">MANAGER</div>
  </header>
  <main id="main"></main>
</div>

<script>
/* ==========================================================================
   DIE TRACKER v2 — client route, 15 stages, operator-selected operation
   ========================================================================== */

/* ---------- route: 15 stages. 1-10 primary, 11-15 behind "Others" ---------- */
const STAGES=[
  {n:1,name:"Raw Casting"},
  {n:2,name:"P1/P2"},
  {n:3,name:"Fitting"},
  {n:4,name:"P3 Machining"},
  {n:5,name:"Heat Treatment"},
  {n:6,name:"P4 Machining"},
  {n:7,name:"P5 Machining"},
  {n:8,name:"Assembly"},
  {n:9,name:"Spotting"},
  {n:10,name:"Trial"},
  {n:11,name:"Surface Correction M/c",other:true},
  {n:12,name:"Trim Correction M/C",other:true},
  {n:13,name:"Part Production",other:true},
  {n:14,name:"ECN Machining",other:true},
  {n:15,name:"Drilling",other:true}
];
const PRIMARY=STAGES.filter(s=>!s.other);
const OTHERS=STAGES.filter(s=>s.other);
const stageName=n=>(STAGES.find(s=>s.n===n)||{}).name||"";

/* ---------- machines: code + name only ---------- */
const SEED_MACHINES=[
  {code:"101",name:"H16"},{code:"102",name:"H22"},
  {code:"103",name:"OK 1"},{code:"104",name:"OK 2"},
  {code:"105",name:"OK 3"},{code:"106",name:"OK 4"},
  {code:"107",name:"RAD 1"},{code:"108",name:"RAD 2"},
  {code:"109",name:"RAD 3"},{code:"110",name:"200T"},
  {code:"111",name:"500T"},{code:"112",name:"800T"},
  {code:"113",name:"NA"}
];
/* ---------- dies: code is what is scanned and typed ---------- */
const SEED_DIES=[
  {code:"2601U",cust:"Maruti Tier-1",part:"Front Door Outer OP20 — Upper"},
  {code:"2601L",cust:"Maruti Tier-1",part:"Front Door Outer OP20 — Lower"},
  {code:"2602",cust:"Maruti Tier-1",part:"Front Door Outer OP30 — Upper"},
  {code:"2603",cust:"Hero Moto",part:"Fuel Tank Draw OP10 — Punch"},
  {code:"2604",cust:"Ashok Leyland",part:"Cross Member Trim — Upper"}
];
const REASONS=[
  {id:"H01",en:"No machine",hi:"मशीन नहीं"},
  {id:"H02",en:"Crane / shifting",hi:"क्रेन"},
  {id:"H03",en:"No program",hi:"प्रोग्राम नहीं"},
  {id:"H04",en:"No tooling",hi:"टूल नहीं"},
  {id:"H07",en:"Press busy",hi:"प्रेस व्यस्त"},
  {id:"H09",en:"Customer hold",hi:"ग्राहक"}
];
const OPERATORS=["Team","OP01 Ramesh","OP02 Suresh","OP03 Anil","OP04 Vikram","OP05 Dinesh"];

const S=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
  stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={
  scan:S('<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>'),
  play:S('<path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/>'),
  stop:S('<rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor" stroke="none"/>'),
  pause:S('<rect x="7" y="4" width="3.5" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="13.5" y="4" width="3.5" height="16" rx="1" fill="currentColor" stroke="none"/>'),
  tick:S('<circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6"/>'),
  back:S('<path d="M15 18l-6-6 6-6"/>'),
  key:S('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/>')
};

let MACHINES=[...SEED_MACHINES],DIES=[...SEED_DIES],EVENTS=[];
let lang="en",side="floor",operator="Team",persisted=false;
let V={view:"home",target:null,mach:null,die:null,pad:"",flash:null,tab:"machines",err:null,showOthers:false};
let stream=null,detector=null,scanLoop=null;

const T={
  scan:{en:"Scan",hi:"स्कैन करें"},scanAny:{en:"Scan die or machine",hi:"डाई या मशीन स्कैन करें"},
  start:{en:"Start",hi:"शुरू करें"},end:{en:"Finish",hi:"पूरा हुआ"},
  pause:{en:"Hold",hi:"रोकें"},resume:{en:"Resume",hi:"फिर शुरू"},
  running:{en:"Running now",hi:"चल रहा है"},nothing:{en:"Nothing running",hi:"कुछ नहीं चल रहा"},
  keypad:{en:"Type code",hi:"कोड लिखें"},cancel:{en:"Cancel",hi:"रद्द करें"},
  needDie:{en:"Now scan the die",hi:"अब डाई स्कैन करें"},
  needMach:{en:"Now scan the machine",hi:"अब मशीन स्कैन करें"},
  why:{en:"Why has it stopped?",hi:"क्यों रुका है?"},
  onhold:{en:"On hold",hi:"रुका हुआ"},
  whichOp:{en:"Which operation?",hi:"कौन सा काम?"},
  others:{en:"Others",hi:"अन्य"},back:{en:"Back",hi:"वापस"}
};
const t=k=>T[k]?(T[k][lang]||T[k].en):k;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(){
  try{
    if(!window.storage) throw 0;
    const [e,m,d,o]=await Promise.all([
      window.storage.get("dt2:events").catch(()=>null),
      window.storage.get("dt2:machines").catch(()=>null),
      window.storage.get("dt2:dies").catch(()=>null),
      window.storage.get("dt2:operator").catch(()=>null)]);
    if(e&&e.value)EVENTS=JSON.parse(e.value);
    if(m&&m.value)MACHINES=JSON.parse(m.value);
    if(d&&d.value)DIES=JSON.parse(d.value);
    if(o&&o.value)operator=o.value;
    persisted=true;
  }catch(_){persisted=false;}
  paintNet();
}
let saveTimer=null;
function save(){
  if(!window.storage)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await window.storage.set("dt2:events",JSON.stringify(EVENTS));
      await window.storage.set("dt2:machines",JSON.stringify(MACHINES));
      await window.storage.set("dt2:dies",JSON.stringify(DIES));
      await window.storage.set("dt2:operator",operator);
      persisted=true;
    }catch(_){persisted=false;}
    paintNet();
  },400);
}
function paintNet(){
  document.getElementById("netdot").className="dot"+(persisted?"":" off");
  document.getElementById("nettext").textContent=persisted?"SAVED":"SESSION";
}

const norm=v=>String(v||"").trim().toUpperCase();
const machineBy=v=>MACHINES.find(m=>norm(m.code)===norm(v));
const dieBy=v=>DIES.find(d=>norm(d.code)===norm(v));

function runOf(mCode){
  const evs=EVENTS.filter(e=>e.machine===mCode).sort((a,b)=>a.ts-b.ts);
  let r=null;
  for(const e of evs){
    if(e.type==="START")r={die:e.die,stage:e.stage,ts:e.ts,by:e.by,paused:false,reason:null};
    else if(e.type==="END")r=null;
    else if(e.type==="PAUSE"&&r){r.paused=true;r.reason=e.reason;}
    else if(e.type==="RESUME"&&r){r.paused=false;r.reason=null;}
  }
  return r;
}
const openRuns=()=>MACHINES.map(m=>({m,r:runOf(m.code)})).filter(x=>x.r);
const stageDone=(die,n)=>EVENTS.some(e=>e.type==="END"&&e.die===die&&e.stage===n);
const runningElsewhere=die=>openRuns().find(x=>x.r.die===die);

/* suggestion only — the operator always chooses */
function suggestStage(dieCode){
  const s=STAGES.find(st=>!st.other&&!stageDone(dieCode,st.n));
  return s?s.n:null;
}
function log(type,extra){
  EVENTS.push(Object.assign({id:"E"+Date.now()+Math.random().toString(36).slice(2,6),
    ts:Date.now(),by:operator,type},extra));
  save();
}
function dieState(code){
  const run=runningElsewhere(code);
  if(run)return{state:run.r.paused?"paused":"running",mach:run.m,stage:run.r.stage,
    ts:run.r.ts,next:suggestStage(code)};
  const done=STAGES.filter(s=>stageDone(code,s.n));
  const evs=EVENTS.filter(e=>e.die===code).sort((a,b)=>b.ts-a.ts);
  return{state:evs.length?"waiting":"new",stage:done.length?done[done.length-1].n:null,
    next:suggestStage(code),last:evs[0]?evs[0].ts:null,done:done.length};
}
function el(ms){
  const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),
    h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  if(d)return d+"d "+h+"h"; if(h)return h+"h "+m+"m"; return m+"m";
}
const stamp=ts=>new Date(ts).toLocaleString("en-GB",{day:"2-digit",month:"short",
  hour:"2-digit",minute:"2-digit",hour12:false});

async function startCam(){
  stopCam();
  const vid=document.getElementById("video"); if(!vid)return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    vid.srcObject=stream; await vid.play();
  }catch(e){setErr("Camera unavailable. Use TYPE CODE below.");return;}
  if(!("BarcodeDetector" in window)){setErr("This browser cannot scan. Use TYPE CODE below.");return;}
  try{detector=new window.BarcodeDetector({formats:["qr_code","code_128","data_matrix","code_39"]});}
  catch(e){setErr("Scanner unavailable. Use TYPE CODE below.");return;}
  scanLoop=setInterval(async()=>{
    if(!detector||!vid.videoWidth)return;
    try{const hits=await detector.detect(vid);
      if(hits&&hits.length){const raw=hits[0].rawValue.trim();stopCam();onScan(raw);}}catch(_){}
  },320);
}
function stopCam(){
  clearInterval(scanLoop);scanLoop=null;detector=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
}
function setErr(m){V.err=m;render();}

function onScan(raw){
  V.err=null;
  const m=machineBy(raw),d=dieBy(raw);
  if(m)return pickMachine(m);
  if(d)return pickDie(d);
  V.err="Code not recognised: "+raw+". Check the label or type the number.";
  V.view="scan";render();
}
function pickMachine(m){
  V.mach=m;
  const r=runOf(m.code);
  if(r){V.die=DIES.find(d=>d.code===r.die)||{code:r.die,part:"—",cust:"—"};V.view="running";}
  else if(V.die){V.showOthers=false;V.view="operation";}
  else{V.target="die";V.view="scan";}
  render();
}
function pickDie(d){
  V.die=d;
  if(V.mach){
    const r=runOf(V.mach.code);
    if(r){V.view="running";}
    else{V.showOthers=false;V.view="operation";}
  }else{V.target="machine";V.view="scan";}
  render();
}
function doStart(stageNo){
  const other=runningElsewhere(V.die.code);
  if(other){
    V.err="Die "+V.die.code+" is already running on "+other.m.name+". Finish it there first.";
    V.view="operation";return render();
  }
  log("START",{die:V.die.code,machine:V.mach.code,stage:stageNo});
  flash("start",stageNo);
}
function doEnd(){
  const r=runOf(V.mach.code); if(!r)return;
  if(r.paused)log("RESUME",{die:r.die,machine:V.mach.code,stage:r.stage});
  log("END",{die:r.die,machine:V.mach.code,stage:r.stage});
  flash("end",r.stage);
}
function doPause(reason){
  const r=runOf(V.mach.code);
  log("PAUSE",{die:r.die,machine:V.mach.code,stage:r.stage,reason:reason.id+" "+reason.en});
  flash("pause",r.stage);
}
function doResume(){
  const r=runOf(V.mach.code);
  log("RESUME",{die:r.die,machine:V.mach.code,stage:r.stage});
  V.view="running";render();
}
function flash(kind,stageNo){
  V.flash={kind,stage:stageNo,die:V.die.code,mach:V.mach.name};
  V.view="flash";render();
  setTimeout(()=>{V.mach=null;V.die=null;V.target=null;V.flash=null;V.showOthers=false;
    V.view="home";render();},2600);
}
function home(){stopCam();V={...V,view:"home",mach:null,die:null,target:null,pad:"",err:null,showOthers:false};render();}

function lamp(){
  if(side==="office")return"office";
  if(V.view==="flash")return V.flash.kind==="pause"?"paused":"ok";
  if(V.err)return"alert";
  if(V.view==="running"){const r=runOf(V.mach.code);return r&&r.paused?"paused":"running";}
  const any=openRuns();
  if(any.some(x=>x.r.paused))return"paused";
  return any.length?"running":"idle";
}

function render(){
  document.body.dataset.side=side;
  document.body.dataset.lamp=lamp();
  document.getElementById("sidechip").textContent=side==="floor"?"MANAGER":"SHOP FLOOR";
  document.getElementById("sidechip").className="chip"+(side==="office"?" on":"");
  document.getElementById("main").innerHTML=side==="office"?office():floor();
  bind();
}
const dieCard=d=>`<div class="card"><div class="code">${esc(d.code)}</div>
  <div class="name">${esc(d.part||"—")}</div><div class="sub">${esc(d.cust||"")}</div></div>`;
const machCard=m=>`<div class="card"><div class="code">${esc(m.code)}</div>
  <div class="name">${esc(m.name)}</div><div class="sub">${lang==="en"?"Machine":"मशीन"}</div></div>`;

function floor(){
  const err=V.err?`<div class="warn">${esc(V.err)}</div>`:"";
  if(V.view==="home"){
    const runs=openRuns();
    return err+`
      <p class="eyebrow">${esc(operator)} · ${runs.length} ${lang==="en"?"in progress":"चल रहे"}</p>
      <button class="btn scan" data-a="scan">${ICON.scan}${t("scan")}<small>${t("scanAny")}</small></button>
      <div class="sp"></div>
      <p class="eyebrow">${t("running")}</p>
      ${runs.length?runs.map(x=>`
        <div class="runitem ${x.r.paused?"p":""}" data-a="open" data-m="${esc(x.m.code)}">
          <div class="t">
            <div class="code" style="font-size:22px;font-family:var(--mono);color:var(--yellow);font-weight:700">${esc(x.r.die)}</div>
            <div class="sub" style="font-size:14px;color:var(--dim)">${esc(x.m.code)} ${esc(x.m.name)} · ${esc(stageName(x.r.stage))}</div>
          </div>
          <div style="text-align:right">
            <div class="el">${el(Date.now()-x.r.ts)}</div>
            <span class="tag ${x.r.paused?"a":"g"}">${x.r.paused?t("onhold"):"RUN"}</span>
          </div>
        </div>`).join(""):`<div class="card"><div class="sub">${t("nothing")}</div></div>`}
      <div class="sp"></div>
      <div class="row two">
        <button class="btn ghost" data-a="oper">${lang==="en"?"Change operator":"ऑपरेटर बदलें"}</button>
        <button class="btn ghost" data-a="pad">${ICON.key} ${t("keypad")}</button>
      </div>`;
  }
  if(V.view==="scan"){
    const need=V.target==="die"?t("needDie"):V.target==="machine"?t("needMach"):t("scanAny");
    return err+`<h1>${esc(need)}</h1>
      <p class="eyebrow">${V.mach?esc(V.mach.code+" "+V.mach.name)+" · ":""}${V.die?esc(V.die.code):""}</p>
      <div class="reticle"><video id="video" playsinline muted></video></div>
      <div class="sp"></div>
      <div class="row two">
        <button class="btn ghost" data-a="pad">${ICON.key} ${t("keypad")}</button>
        <button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>
      </div>`;
  }
  if(V.view==="pad"){
    const keys=["1","2","3","4","5","6","7","8","9","U","0","L","P","C","OK"];
    return err+`<h1>${t("keypad")}</h1>
      <p class="eyebrow">${lang==="en"?"Machine 101-113 · Die e.g. 2601U":"मशीन 101-113 · डाई जैसे 2601U"}</p>
      <div class="padout">${V.pad?esc(V.pad):"—"}</div>
      <div class="pad">${keys.map(k=>{
        const cls=k==="OK"?"ok":(["U","L","P"].includes(k)?"alpha":"");
        return `<button class="${cls}" data-a="key" data-k="${k}">${k}</button>`;}).join("")}</div>
      <div class="sp"></div>
      <button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="operation"){
    const sug=suggestStage(V.die.code);
    const list=V.showOthers?OTHERS:PRIMARY;
    return err+`
      <p class="eyebrow">${esc(V.die.code)} · ${esc(V.mach.code)} ${esc(V.mach.name)}</p>
      <h1>${t("whichOp")}</h1>
      <div class="ops">
        ${list.map(s=>{
          const done=stageDone(V.die.code,s.n);
          const cls=(!V.showOthers&&s.n===sug?"sug ":"")+(done?"done":"");
          return `<div class="op ${cls}" data-a="op" data-n="${s.n}">
            <i>${s.n<10?"0"+s.n:s.n}</i><b>${esc(s.name)}</b></div>`;}).join("")}
        ${V.showOthers
          ? `<div class="op more" data-a="less"><i>&nbsp;</i><b>${ICON.back} ${t("back")}</b></div>`
          : `<div class="op more" data-a="more"><i>11-15</i><b>${t("others")}</b></div>`}
      </div>
      <div class="sp"></div>
      <button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="confirm"){
    return err+`<p class="eyebrow">${lang==="en"?"Check, then start":"जाँचें, फिर शुरू करें"}</p>
      ${dieCard(V.die)}<div class="sp"></div>${machCard(V.mach)}
      <div class="stage">${esc(V.pickN)} · ${esc(stageName(V.pickN))}</div>
      <button class="btn go" data-a="confirmstart">${ICON.play}${t("start")}</button>
      <div class="sp"></div>
      <button class="btn ghost" data-a="backop">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="running"){
    const r=runOf(V.mach.code);
    if(!r){V.view="home";return floor();}
    return err+`<p class="eyebrow">${esc(V.mach.code)} ${esc(V.mach.name)}</p>
      ${dieCard(V.die)}
      <div class="stage">${r.stage} · ${esc(stageName(r.stage))}</div>
      ${r.paused?`<span class="tag a">${t("onhold")} · ${esc(r.reason||"")}</span>`:""}
      <p class="eyebrow" style="margin:14px 0 2px">${lang==="en"?"Elapsed":"बीता समय"}</p>
      <div class="big">${el(Date.now()-r.ts)}</div>
      <div class="sp"></div>
      ${r.paused?`<button class="btn go" data-a="resume">${ICON.play}${t("resume")}</button>`
        :`<button class="btn stop" data-a="end">${ICON.stop}${t("end")}</button>
          <div class="sp"></div>
          <button class="btn hold" data-a="pausemenu">${ICON.pause}${t("pause")}</button>`}
      <div class="sp"></div>
      <button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="pausemenu"){
    return `<h1>${t("why")}</h1>
      <p class="eyebrow">${esc(V.die.code)} · ${esc(V.mach.name)}</p>
      <div class="reasons">${REASONS.map((r,i)=>`
        <div class="reason" data-a="reason" data-i="${i}"><span>${esc(r.en)}</span><em>${esc(r.hi)}</em></div>`).join("")}</div>
      <div class="sp"></div>
      <button class="btn ghost" data-a="back-run">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="oper"){
    return `<h1>${lang==="en"?"Who is working?":"कौन काम कर रहा है?"}</h1>
      <div class="reasons">${OPERATORS.map(o=>`
        <div class="reason" data-a="setoper" data-o="${esc(o)}"><span>${esc(o)}</span></div>`).join("")}</div>
      <div class="sp"></div>
      <button class="btn ghost" data-a="home">${ICON.back} ${t("cancel")}</button>`;
  }
  if(V.view==="flash"){
    const f=V.flash,col=f.kind==="pause"?"var(--amber)":"var(--green)";
    const word=f.kind==="start"?(lang==="en"?"Started":"शुरू")
      :f.kind==="end"?(lang==="en"?"Finished":"पूरा"):(lang==="en"?"On hold":"रुका");
    return `<div class="flash"><div>
      <div style="color:${col}">${ICON.tick}</div>
      <h1 style="margin-top:10px">${word}</h1>
      <div class="code" style="font-size:30px;font-family:var(--mono);color:var(--yellow);font-weight:700">${esc(f.die)}</div>
      <div style="font-size:16px;color:var(--dim);margin-top:4px">${esc(f.mach)} · ${f.stage} ${esc(stageName(f.stage))}</div>
    </div></div>`;
  }
  return "";
}

function office(){
  const tabs=[["machines","Machines"],["dies","Dies"],["events","Event log"],["setup","Setup"]];
  let body="";
  if(V.tab==="machines"){
    const runs=openRuns().length,pau=openRuns().filter(x=>x.r.paused).length;
    body=`<p class="note"><b>${runs}</b> of ${MACHINES.length} machines occupied · <b>${pau}</b> on hold.</p>
      <div class="sp"></div><div class="grid">${MACHINES.map(m=>{
        const r=runOf(m.code);
        return `<div class="mcard ${r?(r.paused?"pau":"run"):""}">
          <h3>${esc(m.name)}</h3><div class="k">${esc(m.code)}</div>
          <div class="v">${r?esc(r.die):"— idle —"}</div>
          <div class="k">${r?esc(r.stage+" "+stageName(r.stage))+" · "+el(Date.now()-r.ts):"available"}</div>
          ${r?`<div class="sp" style="height:10px"></div>
            <button class="obtn dan" data-a="force" data-m="${esc(m.code)}">Force finish</button>`:""}
        </div>`;}).join("")}</div>`;
  }
  if(V.tab==="dies"){
    body=`<table><thead><tr><th>Die</th><th>Customer</th><th>Part</th><th>State</th>
      <th>Stage</th><th>Machine</th><th class="m">Elapsed</th><th class="m">Done</th>
      <th>Expected next</th></tr></thead><tbody>
      ${DIES.map(d=>{const s=dieState(d.code);
        const tg=s.state==="running"?"g":s.state==="paused"?"a":"n";
        return `<tr><td class="m"><b>${esc(d.code)}</b></td><td>${esc(d.cust)}</td>
          <td>${esc(d.part)}</td>
          <td><span class="tag ${tg}">${s.state.toUpperCase()}</span></td>
          <td>${s.stage?esc(s.stage+" "+stageName(s.stage)):"—"}</td>
          <td>${esc(s.mach?s.mach.code+" "+s.mach.name:"—")}</td>
          <td class="m">${s.ts?el(Date.now()-s.ts):(s.last?el(Date.now()-s.last):"—")}</td>
          <td class="m">${STAGES.filter(x=>stageDone(d.code,x.n)).length}/${STAGES.length}</td>
          <td>${s.next?esc(s.next+" "+stageName(s.next)):"—"}</td></tr>`;}).join("")}
      </tbody></table>`;
  }
  if(V.tab==="events"){
    const rows=[...EVENTS].sort((a,b)=>b.ts-a.ts).slice(0,300);
    body=`<button class="obtn pri" data-a="csv">Export CSV</button>
      <span class="note" style="margin-left:12px">${EVENTS.length} events. CSV feeds Excel or Power BI.</span>
      <div class="sp"></div>
      <table><thead><tr><th class="m">When</th><th>Type</th><th class="m">Die</th><th class="m">M/c</th>
      <th>Machine</th><th class="m">Stg</th><th>Operation</th><th>Reason</th><th>By</th></tr></thead><tbody>
      ${rows.length?rows.map(e=>`<tr><td class="m">${stamp(e.ts)}</td>
        <td><span class="tag ${e.type==="START"?"g":e.type==="END"?"n":"a"}">${e.type}</span></td>
        <td class="m">${esc(e.die||"")}</td><td class="m">${esc(e.machine||"")}</td>
        <td>${esc((machineBy(e.machine)||{}).name||"")}</td>
        <td class="m">${e.stage||""}</td><td>${esc(stageName(e.stage))}</td>
        <td>${esc(e.reason||"")}</td><td>${esc(e.by||"")}</td></tr>`).join("")
        :`<tr><td colspan="9" class="note">No events yet.</td></tr>`}
      </tbody></table>`;
  }
  if(V.tab==="setup"){
    body=`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">
      <div class="mcard"><h3>Add die</h3>
        <label>Die code (e.g. 2605U)</label><input id="nd_code" placeholder="2605U">
        <label>Customer</label><input id="nd_cust">
        <label>Part name</label><input id="nd_part">
        <div class="sp"></div><button class="obtn pri" data-a="adddie">Add die</button></div>
      <div class="mcard"><h3>Add machine</h3>
        <label>Machine code</label><input id="nm_code" placeholder="114">
        <label>Machine name</label><input id="nm_name" placeholder="RAD 4">
        <div class="sp"></div><button class="obtn pri" data-a="addmach">Add machine</button>
        <div class="sp"></div><p class="note">Code and name only. Any machine can perform any operation,
        so no stage mapping is held against machines.</p></div>
      <div class="mcard"><h3>Route</h3>
        <p class="note">Stages 1 to 10 appear on the first screen. Stages 11 to 15 sit behind "Others".</p>
        <div class="sp" style="height:8px"></div>
        <table style="font-size:12px"><tbody>
        ${STAGES.map(s=>`<tr><td class="m" style="width:34px">${s.n}</td><td>${esc(s.name)}</td>
          <td class="m" style="width:60px;color:#6D7263">${s.other?"other":""}</td></tr>`).join("")}
        </tbody></table></div>
      <div class="mcard"><h3>Danger zone</h3>
        <p class="note">Clears every logged event. Masters are kept.</p>
        <div class="sp"></div><button class="obtn dan" data-a="wipe">Delete all events</button></div>
    </div>`;
  }
  return `<div class="tabs">${tabs.map(([k,l])=>
    `<button data-a="tab" data-t="${k}" class="${V.tab===k?"on":""}">${l}</button>`).join("")}</div>${body}`;
}

function csv(){
  const h=["event_id","timestamp_iso","timestamp_local","type","die_code","machine_code",
    "machine_name","stage_no","stage_name","reason","operator"];
  const rows=[...EVENTS].sort((a,b)=>a.ts-b.ts).map(e=>[e.id,new Date(e.ts).toISOString(),
    stamp(e.ts),e.type,e.die||"",e.machine||"",(machineBy(e.machine)||{}).name||"",
    e.stage||"",stageName(e.stage),e.reason||"",e.by||""]);
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const txt=[h.map(q).join(","),...rows.map(r=>r.map(q).join(","))].join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+txt],{type:"text/csv;charset=utf-8"}));
  a.download="die_events_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();a.remove();
}

function bind(){
  document.querySelectorAll("[data-a]").forEach(n=>n.onclick=()=>act(n.dataset));
  if(V.view==="scan"&&side==="floor")startCam();
  document.querySelectorAll("input").forEach(i=>i.onclick=e=>e.stopPropagation());
}
function act(d){
  const a=d.a;
  if(a!=="key")V.err=null;
  switch(a){
    case "scan":V.target=null;V.view="scan";render();break;
    case "pad":stopCam();V.pad="";V.view="pad";render();break;
    case "home":home();break;
    case "open":pickMachine(machineBy(d.m));break;
    case "more":V.showOthers=true;render();break;
    case "less":V.showOthers=false;render();break;
    case "op":V.pickN=+d.n;V.view="confirm";render();break;
    case "backop":V.view="operation";render();break;
    case "confirmstart":doStart(V.pickN);break;
    case "end":doEnd();break;
    case "pausemenu":V.view="pausemenu";render();break;
    case "back-run":V.view="running";render();break;
    case "reason":doPause(REASONS[+d.i]);break;
    case "resume":doResume();break;
    case "oper":V.view="oper";render();break;
    case "setoper":operator=d.o;save();home();break;
    case "key":
      if(d.k==="C")V.pad=V.pad.slice(0,-1);
      else if(d.k==="OK"){const p=V.pad;V.pad="";if(p)return onScan(p);}
      else if(V.pad.length<10)V.pad+=d.k;
      render();break;
    case "tab":V.tab=d.t;render();break;
    case "csv":csv();break;
    case "force":{
      const r=runOf(d.m);if(!r)return;
      if(!confirm("Force finish "+r.die+" on "+d.m+"? Logs an END at the current time."))return;
      if(r.paused)EVENTS.push({id:"E"+Date.now()+"r",ts:Date.now(),by:"SUPERVISOR",
        type:"RESUME",die:r.die,machine:d.m,stage:r.stage});
      EVENTS.push({id:"E"+Date.now()+"f",ts:Date.now(),by:"SUPERVISOR",type:"END",
        die:r.die,machine:d.m,stage:r.stage,reason:"Force closed by supervisor"});
      save();render();break;
    }
    case "adddie":{
      const g=i=>(document.getElementById(i)||{}).value||"";
      const code=norm(g("nd_code"));if(!code)return alert("Die code required.");
      if(dieBy(code))return alert("That die already exists.");
      DIES.push({code,cust:g("nd_cust").trim(),part:g("nd_part").trim()});
      save();V.tab="dies";render();break;
    }
    case "addmach":{
      const g=i=>(document.getElementById(i)||{}).value||"";
      const code=norm(g("nm_code"));if(!code)return alert("Machine code required.");
      if(machineBy(code))return alert("That machine already exists.");
      MACHINES.push({code,name:g("nm_name").trim()||code});
      save();V.tab="machines";render();break;
    }
    case "wipe":
      if(confirm("Delete all "+EVENTS.length+" events? This cannot be undone.")){EVENTS=[];save();render();}
      break;
  }
}

document.getElementById("langchip").onclick=()=>{
  lang=lang==="en"?"hi":"en";
  document.getElementById("langchip").classList.toggle("on",lang==="hi");render();};
document.getElementById("sidechip").onclick=()=>{
  stopCam();side=side==="floor"?"office":"floor";
  V={...V,view:"home",mach:null,die:null,target:null,err:null,showOthers:false};render();};
setInterval(()=>{if(side==="floor"&&(V.view==="home"||V.view==="running"))render();
  else if(side==="office"&&(V.tab==="machines"||V.tab==="dies"))render();},30000);
window.addEventListener("pagehide",stopCam);

load().then(render);
</script>
