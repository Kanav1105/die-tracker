<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1026">
<title>Die Tracker — Dashboard</title>
<link rel="manifest" href="./dashboard-manifest.json">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icon-boss-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DT Dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0C1026;--panel:#141A38;--panel2:#1B2247;--line:#2B3260;--chalk:#EDEEF5;
--dim:#8C93B8;--gold:#D4A83C;--red:#E05B5B;--green:#3FBE72;--amber:#E8973F;
--disp:"Barlow Condensed",Impact,sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;
--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;--r:5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--chalk);font-family:var(--body)}
#gate{position:fixed;inset:0;z-index:80;background:var(--ink);display:grid;place-items:center;padding:24px}
#gate .box{width:100%;max-width:360px}
.eyebrow{font-family:var(--disp);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 4px}
h1{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 18px;color:var(--chalk)}
label{display:block;font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 5px}
input{font-family:var(--mono);font-size:15px;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--panel2);color:var(--chalk);width:100%}
.obtn{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;border:1.5px solid var(--gold);background:none;color:var(--gold);border-radius:var(--r);cursor:pointer;width:100%}
.obtn:active{background:var(--gold);color:var(--ink)}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
.note{font-size:13px;color:var(--dim);line-height:1.6;margin-top:18px}
.note a{color:var(--gold)}
header{display:flex;align-items:center;gap:9px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:26px;height:26px;border-radius:50%}
.brand span{font-family:var(--disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px}
.brand b{color:var(--gold)}
.spacer{flex:1}
.chip{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r);color:var(--dim);background:var(--panel2);cursor:pointer}
.chip.bad{color:#F0A0A0;border-color:#5A2020}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
.dot.off{background:var(--red)}
main{padding:22px;max-width:1180px;margin:0 auto}
.range{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.range button{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
padding:8px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:var(--r);cursor:pointer}
.range button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpi .k{font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.kpi .v{font-family:var(--mono);font-size:32px;font-weight:700;margin-top:6px;color:var(--chalk)}
.kpi .v small{font-size:15px;color:var(--dim);font-weight:500}
.kpi.warn .v{color:var(--amber)}
.kpi.good .v{color:var(--green)}
.section{margin-bottom:30px}
.sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.sechead .left{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0}
.sechead .left:hover h2{color:var(--gold)}
.chev{width:20px;height:20px;flex:0 0 auto;color:var(--dim);transition:transform .18s}
.chev.open{transform:rotate(90deg);color:var(--gold)}
.count{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel2);
padding:2px 7px;border-radius:9px;border:1px solid var(--line)}
.jbtn{font-family:var(--disp);font-size:12.5px;font-weight:600;letter-spacing:.06em;
text-transform:uppercase;padding:6px 12px;border:1px solid var(--line);background:var(--panel2);
color:var(--dim);border-radius:var(--r);cursor:pointer;margin-left:6px}
.jbtn:hover{color:var(--chalk)}
.jbtn.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.jbtn.close{border-color:#5A2A2A;color:#E08B8B}
.jbtn.close:hover{background:var(--red);color:#fff;border-color:var(--red)}
h2{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--chalk)}
.sub{font-size:12.5px;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;padding:8px 0}
.bar-row+.bar-row{border-top:1px solid var(--line)}
.bar-label{font-size:13.5px;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-label .code{font-family:var(--mono);font-size:11px;color:var(--dim);display:block}
.bar-track{background:var(--panel2);border-radius:3px;height:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.bar-val{font-family:var(--mono);font-size:13px;color:var(--dim);text-align:right}
.bar-val b{color:var(--chalk);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.empty{color:var(--dim);font-size:13.5px;padding:14px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--disp);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;text-align:left;
padding:8px 10px;border-bottom:1.5px solid var(--line);color:var(--dim);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.m{font-family:var(--mono);font-size:12.5px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 7px;border-radius:2px}
.tag.g{background:rgba(63,190,114,.18);color:#7BE0A0}
.tag.a{background:rgba(232,151,63,.18);color:#F0B372}
.foot{font-size:12px;color:var(--dim);margin-top:30px;padding-top:16px;border-top:1px solid var(--line);line-height:1.6}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="eyebrow">Die Tracker</div>
    <h1>Dashboard</h1>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="err" id="pwerr"></div>
    <div style="height:14px"></div>
    <button class="obtn" id="pwgo">Enter</button>
    <p class="note">Live status and data entry are at
      <a href="./manager.html">manager.html</a>. This page is read-only analytics.</p>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="brand"><img src="./logo.png" alt=""><span>Die&nbsp;<b>Tracker</b> <em style="font-style:normal;color:var(--dim)">· Dashboard</em></span></div>
    <div class="spacer"></div>
    <div class="chip" id="netchip"><span class="dot" id="netdot"></span><span id="nettext">…</span></div>
    <div class="chip" data-a="logout">LOG OUT</div>
  </header>
  <main id="main"><p class="eyebrow" style="padding:20px">Connecting…</p></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./core.js"></script>
<script>
/* ============================================================================
   DASHBOARD PASSWORD — a convenience gate, not security. Same caveat as
   manager.html: this sits in JavaScript anyone can read with View Source.
   Give it out only to whoever should see plant-wide numbers.
   CHANGE IT, then commit and bump CACHE in sw.js.
   ============================================================================ */
const DASH_PASSWORD  = "boardroom2026";
const SESSION_HOURS  = 24;

function unlocked(){
  const v = LS.get("dt:dash");
  return v && (Date.now()-Number(v)) < SESSION_HOURS*3600*1000;
}
function openApp(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  boot();
}
function tryPw(){
  const el=document.getElementById("pw"), err=document.getElementById("pwerr");
  if(el.value===DASH_PASSWORD){ LS.set("dt:dash",String(Date.now())); openApp(); }
  else { err.textContent="Wrong password."; el.value=""; el.focus(); }
}
document.getElementById("pwgo").onclick=tryPw;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryPw();});
document.querySelector('[data-a="logout"]').onclick=()=>{ LS.set("dt:dash",""); location.reload(); };

/* ============================================================================
   DATA
   Live counts (dies on hold, dies at NA/OS right now) come from core.js's
   normal connect(), same as manager.html. Historical aggregates come from
   the SQL views, queried directly — these are not limited by HISTORY_DAYS
   and do the heavy lifting in the database instead of the browser.
   ============================================================================ */
/* Date window. FROM_TS/TO_TS are ISO strings; TO_TS null means "till date". */
let RANGE_DAYS = 30;                 // kept for the quick buttons' active state
let FROM_TS = null, TO_TS = null;    // null = derive from RANGE_DAYS
let RANGE_LABEL = "30d";
function windowFrom(){
  if(FROM_TS) return new Date(FROM_TS).toISOString();
  return new Date(Date.now()-RANGE_DAYS*864e5).toISOString();
}
function windowTo(){
  return TO_TS ? new Date(TO_TS+"T23:59:59").toISOString() : new Date().toISOString();
}
function setQuick(days,label){ RANGE_DAYS=days; FROM_TS=null; TO_TS=null; RANGE_LABEL=label; }
function startOf(kind){
  const n=new Date();
  if(kind==="wtd"){ const d=new Date(n); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow);
    d.setHours(0,0,0,0); return d; }
  if(kind==="mtd") return new Date(n.getFullYear(), n.getMonth(), 1);
  if(kind==="ytd") return new Date(n.getFullYear(), 0, 1);
  return n;
}
const isoDate = d => new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
let VIEWDATA = { holds:[], occupancy:[], leadtime:[], queue:[], mutil:[], dutil:[] };
/* Denominator for utilisation. 24 = calendar time. Set to your real shift
   pattern (8 one shift, 16 two shifts) so idle time means "could have been
   running but wasn't", not "the factory was shut". */
let HOURS_PER_DAY = Number(LS.get("dt:hpd")) || 24;
let dashErr = null;
let DIELIST = [], DIEQ = "", SELDIE = null, JOURNEY = [], DIEEVENTS = [];
/* Which sections are expanded. Persisted per device so each board member keeps
   their own layout. */
const SEC_DEFAULT = {kpi:true, journey:true, holds:true, queue:true,
                     occ:false, mutil:false, dutil:false, lead:false};
let OPEN = (()=>{ try{ return {...SEC_DEFAULT, ...JSON.parse(LS.get("dt:open")||"{}")}; }
                  catch(e){ return {...SEC_DEFAULT}; } })();
function toggleSec(k){ OPEN[k]=!OPEN[k]; LS.set("dt:open", JSON.stringify(OPEN)); }
let JOURNEY_MODE = "stages";   // "stages" | "events"
let JOURNEY_ALL  = false;      // true = ignore the date window for this die

async function loadViews(){
  const p = { from_ts: windowFrom(), to_ts: windowTo() };
  try{
    const [holds, occ, lead, queue, mutil, dutil, dlist] = await Promise.all([
      sb.rpc("f_hold_summary", p),
      sb.rpc("f_machine_occupancy", p),
      sb.rpc("f_die_leadtime", p),
      sb.rpc("f_queue_by_stage", p),
      sb.rpc("f_machine_utilisation", { ...p, hours_per_day: HOURS_PER_DAY }),
      sb.rpc("f_die_utilisation", p),
      sb.rpc("f_die_list", p)
    ]);
    for(const r of [holds,occ,lead,queue,mutil,dutil,dlist]) if(r.error) throw r.error;
    const num = (rows,keys)=> (rows||[]).map(r=>{
      const o={...r}; keys.forEach(k=>{ if(o[k]!=null) o[k]=Number(o[k]); }); return o; });
    VIEWDATA = {
      holds:      num(holds.data, ["total_hours","total_days","occurrences"]),
      occupancy:  num(occ.data,   ["occupied_hours","visits"]),
      leadtime:   num(lead.data,  ["elapsed_days","touch_days","outsourced_days"]),
      queue:      num(queue.data, ["avg_queue_hours","max_queue_hours","data_points"]),
      mutil:      num(mutil.data, ["available_hours","busy_hours","idle_hours","util_pct","visits"]),
      dutil:      num(dutil.data, ["window_hours","active_hours","vacant_hours","util_pct","sessions"])
    };
    DIELIST = num(dlist.data, ["stages_done","elapsed_days","touch_days","hold_days"]);
    dashErr = null;
  }catch(e){ dashErr = e.message || String(e); }
}

/* core.js calls render() unconditionally at the end of connect(). floor.html
   and manager.html each define their own render(); this page needs one too,
   or connect() throws "render is not defined" and boot() silently dies,
   leaving the page stuck on "Connecting…" forever. */
function render(){ renderDash(); }

async function loadJourney(){
  if(!SELDIE){ JOURNEY=[]; DIEEVENTS=[]; return; }
  const from = JOURNEY_ALL ? new Date(0).toISOString() : windowFrom();
  const to   = JOURNEY_ALL ? new Date().toISOString() : windowTo();
  try{
    const [j,e] = await Promise.all([
      sb.rpc("f_die_journey", { p_die: SELDIE, from_ts: from, to_ts: to }),
      sb.rpc("f_die_events",  { p_die: SELDIE, from_ts: from, to_ts: to })
    ]);
    if(j.error) throw j.error; if(e.error) throw e.error;
    JOURNEY   = (j.data||[]).map(r=>({...r,
      duration_hours:Number(r.duration_hours), queue_before_hours:r.queue_before_hours==null?null:Number(r.queue_before_hours),
      hold_hours:Number(r.hold_hours)}));
    DIEEVENTS = e.data||[];
    dashErr=null;
  }catch(err){ dashErr = err.message || String(err); }
}

async function boot(){
  await connect();          // core.js: loads STAGES/MACHINES/DIES/EVENTS, opens realtime
  await loadViews();
  renderDash();
  setInterval(async()=>{ await loadViews(); renderDash(); }, 60000);
}

/* ---------------------------------------------------------------- render */
function bar(rows, opts){
  if(!rows.length) return `<p class="empty">${opts.empty}</p>`;
  const max = Math.max(...rows.map(r=>r.v), 0.001);
  return rows.map(r=>`
    <div class="bar-row">
      <div class="bar-label">${esc(r.label)}${r.sub?`<span class="code">${esc(r.sub)}</span>`:""}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,r.v/max*100)}%;background:${r.color||"var(--gold)"}"></div></div>
      <div class="bar-val"><b>${r.big}</b> ${r.small||""}</div>
    </div>`).join("");
}

function renderDash(){
  if(dashErr){
    document.getElementById("main").innerHTML =
      `<div class="card" style="border-color:var(--red)">
        <b style="color:var(--red)">Could not load analytics:</b> ${esc(dashErr)}<br>
        <span class="sub">Most likely the views have not been created yet. Run dashboard_views.sql in the Supabase SQL Editor, including the function definitions at the end.</span>
      </div>`;
    paintNet(); return;
  }

  const runsNow = openRuns();
  const onHold = runsNow.filter(x=>x.r.paused).length;
  const atNAOS = runsNow.filter(x=>isMultiDie(x.r.machine)).length;
  const occupiedReal = realOpenRuns().length;
  const realTotal = realMachines().length;

  const lt = VIEWDATA.leadtime.filter(d=>d.elapsed_days!=null && d.elapsed_days>0);
  const avgTouch = lt.length
    ? (lt.reduce((s,d)=>s+ (d.touch_days/d.elapsed_days), 0)/lt.length*100) : null;
  const osDays = lt.reduce((s,d)=>s+Number(d.outsourced_days||0),0);

  const holdDaysTotal = VIEWDATA.holds.reduce((s,h)=>s+Number(h.total_days||0),0);

  const kpis = `
    <div class="kpis">
      <div class="kpi"><div class="k">Dies in progress</div><div class="v">${runsNow.length}</div></div>
      <div class="kpi ${onHold?"warn":""}"><div class="k">On hold right now</div><div class="v">${onHold}</div></div>
      <div class="kpi"><div class="k">Machines occupied</div><div class="v">${occupiedReal}<small> / ${realTotal}</small></div></div>
      <div class="kpi"><div class="k">At NA / outsourced</div><div class="v">${atNAOS}</div></div>
      <div class="kpi ${avgTouch!=null&&avgTouch<20?"warn":""}"><div class="k">Avg touch % of lead time</div>
        <div class="v">${avgTouch!=null?avgTouch.toFixed(0)+"%":"—"}</div></div>
      <div class="kpi warn"><div class="k">Hold days, selected range</div><div class="v">${holdDaysTotal.toFixed(1)}</div></div>
      <div class="kpi"><div class="k">Outsourced days, range</div><div class="v">${osDays.toFixed(1)}</div></div>
    </div>`;

  const holdBars = bar(VIEWDATA.holds.map(h=>({
      label:h.reason_label, sub:h.reason_code, v:Number(h.total_days),
      big:h.total_days, small:"days", color: h.reason_code==="H09"?"var(--red)":"var(--gold)"
    })), {empty:"No holds recorded yet."});

  const occBars = bar(VIEWDATA.occupancy.slice(0,10).map(m=>({
      label:m.machine_name, sub:m.machine_code, v:Number(m.occupied_hours),
      big:(m.occupied_hours/24).toFixed(1), small:"days"
    })), {empty:"No completed machine visits yet."});

  const queueBars = bar(VIEWDATA.queue.map(q=>({
      label:q.stage_name, sub:"stage "+q.stage_no, v:Number(q.avg_queue_hours),
      big:(q.avg_queue_hours/24).toFixed(1), small:"days avg", color:"var(--amber)"
    })), {empty:"Not enough completed stage transitions yet."});

  const utilBar = p => {
    const pct = Math.max(0, Math.min(100, Number(p)||0));
    const col = pct>=70?"var(--green)":pct>=40?"var(--gold)":"var(--amber)";
    return `<div class="bar-track" style="height:14px"><div class="bar-fill"
      style="width:${pct}%;background:${col}"></div></div>`;
  };

  const mUtilTable = (VIEWDATA.mutil||[]).length ? `<table><thead><tr>
      <th>Machine</th><th class="m">Available</th><th class="m">Busy</th>
      <th class="m">Idle</th><th style="width:130px">Utilisation</th><th class="m">%</th><th class="m">Jobs</th>
    </tr></thead><tbody>${VIEWDATA.mutil.map(m=>`<tr>
      <td><b>${esc(m.machine_name)}</b> <span class="sub">${esc(m.machine_code)}</span></td>
      <td class="m">${(m.available_hours/24).toFixed(1)}d</td>
      <td class="m">${(m.busy_hours/24).toFixed(1)}d</td>
      <td class="m">${(m.idle_hours/24).toFixed(1)}d</td>
      <td>${utilBar(m.util_pct)}</td>
      <td class="m"><b>${Number(m.util_pct).toFixed(0)}%</b></td>
      <td class="m">${m.visits}</td></tr>`).join("")}</tbody></table>`
    : `<p class="empty">No completed machine activity in this range yet.</p>`;

  const dUtilTable = (VIEWDATA.dutil||[]).slice(0,15).length ? `<table><thead><tr>
      <th>Die</th><th class="m">Tracked</th><th class="m">Active</th>
      <th class="m">Vacant</th><th style="width:130px">Utilisation</th><th class="m">%</th><th class="m">Ops</th>
    </tr></thead><tbody>${VIEWDATA.dutil.slice(0,15).map(d=>`<tr>
      <td class="m"><b>${esc(d.die_code)}</b></td>
      <td class="m">${(d.window_hours/24).toFixed(1)}d</td>
      <td class="m">${(d.active_hours/24).toFixed(1)}d</td>
      <td class="m">${(d.vacant_hours/24).toFixed(1)}d</td>
      <td>${utilBar(d.util_pct)}</td>
      <td class="m"><b>${Number(d.util_pct).toFixed(0)}%</b></td>
      <td class="m">${d.sessions}</td></tr>`).join("")}</tbody></table>`
    : `<p class="empty">No die activity in this range yet.</p>`;

  /* collapsible section wrapper */
  const CHEV = `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
  const sec = (key,title,subtitle,body,badge,extraId) =>
    `<div class="section"${extraId?` id="${extraId}"`:""}>
      <div class="sechead">
        <div class="left" data-a="sec" data-k="${key}">
          ${CHEV.replace('class="chev"', 'class="chev'+(OPEN[key]?" open":"")+'"')}
          <h2>${title}</h2>
          ${badge!=null?`<span class="count">${badge}</span>`:""}
        </div>
        <span class="sub">${subtitle||""}</span>
      </div>
      ${OPEN[key]?body:""}
    </div>`;

  /* ---------------- die journey ---------------- */
  const q = (DIEQ||"").trim().toUpperCase();
  const dieRows = q
    ? DIELIST.filter(d=>(d.die_code+" "+(d.part||"")+" "+(d.operation||"")).toUpperCase().includes(q))
    : DIELIST;
  const dieListHtml = dieRows.length ? `<table><thead><tr>
      <th>Die</th><th>Operation</th><th>Part</th><th>State</th><th>Now at</th>
      <th class="m">Stages</th><th class="m">Elapsed</th><th class="m">Touch</th><th class="m">Hold</th><th></th>
    </tr></thead><tbody>${dieRows.slice(0,30).map(d=>`<tr${d.die_code===SELDIE?' style="background:var(--panel2)"':""}>
      <td class="m"><b>${esc(d.die_code)}</b></td>
      <td>${esc(d.operation||"")}</td><td>${esc(d.part||"")}</td>
      <td><span class="tag ${d.state==="running"?"g":"a"}">${(d.state||"").toUpperCase()}</span></td>
      <td>${d.current_stage?esc(d.current_stage_no+" "+d.current_stage):"—"}
        ${d.current_machine?`<span class="sub">${esc(d.current_machine)}</span>`:""}</td>
      <td class="m">${d.stages_done}</td>
      <td class="m">${Number(d.elapsed_days).toFixed(1)}d</td>
      <td class="m">${Number(d.touch_days).toFixed(1)}d</td>
      <td class="m">${Number(d.hold_days)>0?Number(d.hold_days).toFixed(1)+"d":"—"}</td>
      <td><button class="obtn" data-a="pickdie" data-c="${esc(d.die_code)}"
        style="width:auto;padding:5px 11px;font-size:12px">Journey</button></td></tr>`).join("")}
    </tbody></table>${dieRows.length>30?`<p class="sub" style="margin-top:8px">Showing first 30 of ${dieRows.length}.</p>`:""}`
    : `<p class="empty">${DIELIST.length?"No die matches that search.":"No die activity in this window."}</p>`;

  let journeyHtml = "";
  if(SELDIE){
    const totH = JOURNEY.reduce((s,r)=>s+Number(r.duration_hours||0),0);
    const totQ = JOURNEY.reduce((s,r)=>s+Number(r.queue_before_hours||0),0);
    const totHold = JOURNEY.reduce((s,r)=>s+Number(r.hold_hours||0),0);
    const workH = totH - totHold;
    const stagesTbl = JOURNEY.length ? `<table><thead><tr>
        <th class="m">#</th><th>Stage</th><th>Machine</th><th class="m">Started</th><th class="m">Ended</th>
        <th class="m">Queue before</th><th class="m">Duration</th><th class="m">Hold</th>
        <th class="m">Working</th><th>By</th></tr></thead><tbody>
      ${JOURNEY.map(r=>{
        const work=Number(r.duration_hours)-Number(r.hold_hours);
        return `<tr>
        <td class="m">${r.seq}</td>
        <td><b>${esc(r.stage_no+" "+(r.stage_name||""))}</b>${r.is_open?` <span class="tag g">OPEN</span>`:""}</td>
        <td>${esc(r.machine_name||r.machine_code||"—")}</td>
        <td class="m">${stamp(new Date(r.started_at).getTime())}</td>
        <td class="m">${r.ended_at?stamp(new Date(r.ended_at).getTime()):"—"}</td>
        <td class="m">${r.queue_before_hours==null?"—":(r.queue_before_hours/24).toFixed(1)+"d"}</td>
        <td class="m">${(r.duration_hours/24).toFixed(1)}d</td>
        <td class="m">${Number(r.hold_hours)>0?`<span style="color:var(--amber)">${(r.hold_hours/24).toFixed(1)}d</span>`:"—"}</td>
        <td class="m"><b>${(work/24).toFixed(1)}d</b></td>
        <td>${esc(r.operator||"")}</td></tr>`}).join("")}
      </tbody></table>` : `<p class="empty">No stage visits for this die in the selected window.</p>`;

    const eventsTbl = DIEEVENTS.length ? `<table><thead><tr>
        <th class="m">When</th><th>Type</th><th>Stage</th><th>Machine</th><th>Reason</th><th>By</th><th class="m">Device</th>
      </tr></thead><tbody>${DIEEVENTS.map(e=>`<tr>
        <td class="m">${stamp(new Date(e.ts).getTime())}</td>
        <td><span class="tag ${e.type==="START"?"g":e.type==="END"?"a":"a"}">${esc(e.type)}</span></td>
        <td>${e.stage_no?esc(e.stage_no+" "+(e.stage_name||"")):"—"}</td>
        <td>${esc(e.machine_name||e.machine_code||"—")}</td>
        <td>${esc(e.reason||"")}</td><td>${esc(e.operator||"")}</td>
        <td class="m sub">${esc(e.device_id||"")}</td></tr>`).join("")}</tbody></table>`
      : `<p class="empty">No events for this die in the selected window.</p>`;

    journeyHtml = `<div class="section" id="journeysec">
      <div class="sechead">
        <div class="left" style="cursor:default">
          <h2>Journey — ${esc(SELDIE)}</h2>
          <span class="count">${JOURNEY.length} stage${JOURNEY.length===1?"":"s"}</span>
        </div>
        <span>
          <button class="jbtn ${JOURNEY_MODE==="stages"?"on":""}" data-a="jmode" data-m="stages">Stage visits</button>
          <button class="jbtn ${JOURNEY_MODE==="events"?"on":""}" data-a="jmode" data-m="events">Every event</button>
          <button class="jbtn ${JOURNEY_ALL?"on":""}" data-a="jall">${JOURNEY_ALL?"Full history":"Within dates"}</button>
          <button class="jbtn close" data-a="closedie">Close</button>
        </span>
      </div>
      <div class="kpis" style="margin-bottom:14px">
        <div class="kpi"><div class="k">Stage visits</div><div class="v">${JOURNEY.length}</div></div>
        <div class="kpi"><div class="k">Total elapsed in stages</div><div class="v">${(totH/24).toFixed(1)}<small>d</small></div></div>
        <div class="kpi warn"><div class="k">Of which on hold</div><div class="v">${(totHold/24).toFixed(1)}<small>d</small></div></div>
        <div class="kpi good"><div class="k">Actual working time</div><div class="v">${(workH/24).toFixed(1)}<small>d</small></div></div>
        <div class="kpi"><div class="k">Queue between stages</div><div class="v">${(totQ/24).toFixed(1)}<small>d</small></div></div>
      </div>
      <div class="card">${JOURNEY_MODE==="stages"?stagesTbl:eventsTbl}</div>
    </div>`;
  }

  const ltRows = [...VIEWDATA.leadtime]
    .filter(d=>d.elapsed_days>0)
    .sort((a,b)=>b.elapsed_days-a.elapsed_days).slice(0,12);
  const ltTable = ltRows.length ? `<table><thead><tr>
      <th>Die</th><th class="m">Elapsed</th><th class="m">Touch</th>
      <th class="m">At vendor</th><th>Touch %</th>
    </tr></thead><tbody>${ltRows.map(d=>{
      const pct = d.touch_days/d.elapsed_days*100;
      const os  = Number(d.outsourced_days||0);
      return `<tr><td class="m"><b>${esc(d.die_code)}</b></td>
        <td class="m">${d.elapsed_days.toFixed(1)}d</td>
        <td class="m">${d.touch_days.toFixed(1)}d</td>
        <td class="m">${os>0?os.toFixed(1)+"d":"—"}</td>
        <td><span class="tag ${pct<25?"a":"g"}">${pct.toFixed(0)}%</span></td></tr>`;
    }).join("")}</tbody></table>` : `<p class="empty">No die history yet.</p>`;

  document.getElementById("main").innerHTML = `
    <div class="range">
      ${[[7,"7d"],[30,"30d"],[90,"90d"],[365,"365d"]].map(([d,l])=>
        `<button class="${!FROM_TS&&d===RANGE_DAYS?"on":""}" data-a="range" data-d="${d}" data-l="${l}">${l}</button>`).join("")}
      ${[["wtd","WTD"],["mtd","MTD"],["ytd","YTD"]].map(([k,l])=>
        `<button class="${RANGE_LABEL===l?"on":""}" data-a="period" data-k="${k}" data-l="${l}">${l}</button>`).join("")}
      <span style="width:14px"></span>
      <span class="sub">From</span>
      <input type="date" id="fromd" value="${FROM_TS||isoDate(new Date(Date.now()-RANGE_DAYS*864e5))}"
        style="width:150px;padding:7px 9px">
      <span class="sub">to</span>
      <input type="date" id="tod" value="${TO_TS||""}" placeholder="till date" style="width:150px;padding:7px 9px">
      <button class="obtn" data-a="applydates" style="width:auto;padding:8px 14px">Apply</button>
      ${(FROM_TS||TO_TS)?`<button data-a="cleardates">Clear</button>`:""}
      <span style="width:14px"></span>
      ${[[24,"24h/day"],[16,"2 shifts"],[8,"1 shift"]].map(([v,l])=>
        `<button class="${v===HOURS_PER_DAY?"on":""}" data-a="hpd" data-v="${v}">${l}</button>`).join("")}
    </div>
    <p class="sub" style="margin:-10px 0 18px">Showing
      <b style="color:var(--chalk)">${FROM_TS?FROM_TS:isoDate(new Date(Date.now()-RANGE_DAYS*864e5))}</b>
      to <b style="color:var(--chalk)">${TO_TS?TO_TS:"today"}</b></p>
    <div class="sechead" style="margin-bottom:10px">
      <div class="left" data-a="sec" data-k="kpi">
        ${CHEV.replace('class="chev"', 'class="chev'+(OPEN.kpi?" open":"")+'"')}
        <h2>Current status</h2></div>
      <span class="sub">live — always this moment, ignores the date range</span>
    </div>
    ${OPEN.kpi?kpis:""}
    ${sec("journey","Die journey","search a die, then open its full route",
      `<div class="card">
        <input id="diesearch" placeholder="Search die code, part or operation…"
          value="${esc(DIEQ)}" style="max-width:360px;margin-bottom:12px">
        ${dieListHtml}
      </div>`, DIELIST.length)}
    ${journeyHtml}
    ${sec("holds","Hold time by reason","total days lost",
      `<div class="card">${holdBars}</div>`, VIEWDATA.holds.length)}
    ${sec("queue","Queue time by stage","average wait before the stage starts",
      `<div class="card">${queueBars}</div>`, VIEWDATA.queue.length)}
    ${sec("occ","Machine occupancy","completed visits, real machines only, NA and OS excluded",
      `<div class="card">${occBars}</div>`, (VIEWDATA.occupancy||[]).length)}
    ${sec("mutil","Machine utilisation",
      `busy vs idle since each machine's first recorded use${HOURS_PER_DAY<24?`, against ${HOURS_PER_DAY}h/day`:", calendar hours"}`,
      `<div class="card">${mUtilTable}</div>`, (VIEWDATA.mutil||[]).length)}
    ${sec("dutil","Die utilisation","active vs vacant since each die's first recorded activity",
      `<div class="card">${dUtilTable}</div>`, (VIEWDATA.dutil||[]).length)}
    ${sec("lead","Longest-running dies","elapsed time vs actual work time",
      `<div class="card">${ltTable}</div>`, ltRows.length)}
    <p class="foot">
      Touch % is time in a logged session divided by total elapsed time since the die's first event.
      NA counts as touch, since assembly and fitting setups are real work. Time at an outside vendor
      also sits inside a session, so it is broken out separately in the "at vendor" column and the
      KPI above — subtract it if you want touch excluding outsourcing. Watch the trend, not the
      absolute value.<br>
      Queue figures come from completed stage transitions only. An open hold does count, measured
      against the current time. The KPI cards above always reflect this moment; the charts respect
      the selected date range.
    </p>`;
  paintNet();
  const s=document.getElementById("diesearch");
  if(s){
    s.oninput=()=>{ DIEQ=s.value; renderDash(); };
    if(DIEQ){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  }
}

document.querySelectorAll('[data-a="range"]').forEach; // (delegated below)
document.getElementById("app").addEventListener("click", async (e)=>{
  const b = e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a;
  if(a==="range"){ setQuick(Number(b.dataset.d), b.dataset.l);
    await loadViews(); if(SELDIE) await loadJourney(); renderDash(); }
  if(a==="period"){ const s=startOf(b.dataset.k);
    FROM_TS=isoDate(s); TO_TS=null; RANGE_LABEL=b.dataset.l;
    await loadViews(); if(SELDIE) await loadJourney(); renderDash(); }
  if(a==="applydates"){
    const f=document.getElementById("fromd"), t=document.getElementById("tod");
    if(f&&f.value){ FROM_TS=f.value; TO_TS=(t&&t.value)?t.value:null; RANGE_LABEL="custom";
      await loadViews(); if(SELDIE) await loadJourney(); renderDash(); }
  }
  if(a==="cleardates"){ setQuick(30,"30d");
    await loadViews(); if(SELDIE) await loadJourney(); renderDash(); }
  if(a==="pickdie"){ SELDIE=b.dataset.c; JOURNEY_MODE="stages";
    if(!OPEN.journey){ OPEN.journey=true; LS.set("dt:open",JSON.stringify(OPEN)); }
    await loadJourney(); renderDash();
    /* scroll to the journey panel itself, not the first heading on the page */
    requestAnimationFrame(()=>{
      const el=document.getElementById("journeysec");
      if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"start"});
    });
  }
  if(a==="sec"){ toggleSec(b.dataset.k); renderDash(); }
  if(a==="closedie"){ SELDIE=null; JOURNEY=[]; DIEEVENTS=[]; JOURNEY_ALL=false; renderDash(); }
  if(a==="jmode"){ JOURNEY_MODE=b.dataset.m; renderDash(); }
  if(a==="jall"){ JOURNEY_ALL=!JOURNEY_ALL; await loadJourney(); renderDash(); }
  if(b.dataset.a==="hpd"){ HOURS_PER_DAY=Number(b.dataset.v); LS.set("dt:hpd",String(HOURS_PER_DAY));
    await loadViews(); renderDash(); }
});

if(unlocked()) openApp(); else document.getElementById("pw").focus();
</script>
</body>
</html>
