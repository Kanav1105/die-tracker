<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12140F">
<title>Die Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12140F;--panel:#1E2119;--panel2:#282C22;--steel:#9AA39B;--chalk:#EDEDE6;
--dim:#8C9187;--yellow:#F2C200;--red:#D6252A;--green:#2FA84F;--amber:#E8873B;
--paper:#E8E4D9;--paperInk:#23261F;--line:#3A3F33;--r:4px;
--disp:"Barlow Condensed",Impact,sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;
--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);overflow:hidden;user-select:none}
#andon{position:fixed;inset:0;pointer-events:none;z-index:60;border:10px solid transparent;transition:border-color .25s,box-shadow .25s}
body[data-lamp=idle] #andon{border-color:#3A3F33}
body[data-lamp=running] #andon{border-color:var(--green);box-shadow:inset 0 0 60px rgba(47,168,79,.22)}
body[data-lamp=paused] #andon{border-color:var(--amber);box-shadow:inset 0 0 60px rgba(232,135,59,.22)}
body[data-lamp=alert] #andon{border-color:var(--red);box-shadow:inset 0 0 60px rgba(214,37,42,.25)}
body[data-lamp=ok] #andon{border-color:var(--green);box-shadow:inset 0 0 90px rgba(47,168,79,.4)}
body[data-lamp=office] #andon{border-color:#B9B3A3}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
body[data-lamp=paused] #andon{animation:pulse 1.6s ease-in-out infinite}
#app{height:100%;display:flex;flex-direction:column}
header{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--steel)}
.brand b{color:var(--yellow)}
.spacer{flex:1}
.chip{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:6px 9px;border:1px solid var(--line);
border-radius:var(--r);color:var(--dim);background:var(--panel2);cursor:pointer;white-space:nowrap}
.chip.on{color:var(--ink);background:var(--yellow);border-color:var(--yellow)}
.chip.bad{color:#F08A8D;border-color:#5A2020}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
.dot.off{background:var(--red)}.dot.wait{background:var(--amber)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px;-webkit-overflow-scrolling:touch}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(24px,4vw,38px);letter-spacing:.03em;text-transform:uppercase;margin:0 0 4px}
.eyebrow{font-family:var(--disp);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;border:none;
border-radius:var(--r);cursor:pointer;font-family:var(--disp);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
padding:26px 18px;font-size:26px;line-height:1;color:var(--ink);transition:transform .06s,filter .12s}
.btn:active{transform:scale(.985);filter:brightness(1.1)}
.btn small{font-family:var(--body);font-weight:500;font-size:14px;letter-spacing:.02em;text-transform:none;opacity:.72}
.btn.scan{background:var(--yellow);padding:38px 18px;font-size:34px}
.btn.go{background:var(--green);color:#06210F;padding:38px 18px;font-size:34px}
.btn.stop{background:var(--red);color:#fff;padding:38px 18px;font-size:34px}
.btn.hold{background:var(--amber);color:#22120A}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-size:17px;padding:15px}
.btn.ghost:active{color:var(--chalk)}
.btn svg{width:34px;height:34px}
.row{display:grid;gap:12px}.row.two{grid-template-columns:1fr 1fr}
@media(max-width:560px){.row.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.card .code{font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:.03em;color:var(--yellow);line-height:1.1}
.card .name{font-family:var(--disp);font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.card .sub{font-size:14px;color:var(--dim);margin-top:2px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 7px;border-radius:2px;letter-spacing:.04em;margin-top:8px}
.tag.g{background:rgba(47,168,79,.18);color:#7BD996}
.tag.a{background:rgba(232,135,59,.18);color:#F0A972}
.tag.n{background:var(--panel2);color:var(--dim)}
.stage{font-family:var(--disp);font-size:clamp(22px,3.6vw,32px);font-weight:700;text-transform:uppercase;letter-spacing:.03em;
color:var(--chalk);border-left:5px solid var(--yellow);padding-left:14px;margin:18px 0}
.big{font-family:var(--mono);font-size:clamp(32px,6.5vw,56px);font-weight:700;line-height:1}
.runitem{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--panel);border:1px solid var(--line);
border-left:5px solid var(--green);border-radius:var(--r);cursor:pointer;margin-bottom:10px}
.runitem.p{border-left-color:var(--amber)}.runitem:active{background:var(--panel2)}
.runitem .t{flex:1;min-width:0}
.runitem .dc{font-family:var(--mono);font-size:21px;color:var(--yellow);font-weight:700}
.runitem .sb{font-size:13.5px;color:var(--dim)}
.runitem .el{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--steel)}
#video{width:100%;max-height:42vh;background:#000;border-radius:var(--r);object-fit:cover;display:block}
.reticle{position:relative}
.reticle::after{content:"";position:absolute;inset:14%;border:3px solid var(--yellow);border-radius:var(--r);
box-shadow:0 0 0 9999px rgba(18,20,15,.45);pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.pad button{font-family:var(--mono);font-size:26px;font-weight:600;padding:16px 0;background:var(--panel2);color:var(--chalk);
border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.pad button:active{background:var(--yellow);color:var(--ink)}
.pad button.alpha{color:var(--yellow)}
.pad button.ok{background:var(--green);color:#06210F;border-color:var(--green)}
.padout{font-family:var(--mono);font-size:36px;font-weight:700;letter-spacing:.14em;text-align:center;padding:12px;
background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:62px;color:var(--yellow)}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.op{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 12px;cursor:pointer;
text-align:left;color:var(--chalk);position:relative}
.op:active{background:var(--yellow);color:var(--ink)}
.op b{display:block;font-family:var(--disp);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;line-height:1.15}
.op i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
.op:active i{color:var(--ink);opacity:.65}
.op.sug{border-color:var(--green);border-width:2px;background:rgba(47,168,79,.1)}
.op.sug::after{content:"EXPECTED NEXT";position:absolute;top:-9px;right:8px;font-family:var(--mono);font-size:9px;
font-weight:700;letter-spacing:.08em;background:var(--green);color:#06210F;padding:2px 6px;border-radius:2px}
.op.done{opacity:.55}
.op.done::after{content:"DONE";position:absolute;top:-9px;right:8px;font-family:var(--mono);font-size:9px;font-weight:700;
letter-spacing:.08em;background:var(--panel2);color:var(--dim);padding:2px 6px;border-radius:2px;border:1px solid var(--line)}
.op.more{background:var(--panel2);border-style:dashed}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.reason{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:19px 14px;cursor:pointer;
text-align:center;color:var(--chalk)}
.reason:active{background:var(--amber);color:#22120A}
.reason span{display:block;font-family:var(--disp);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.reason em{display:block;font-style:normal;font-size:13px;color:var(--dim);margin-top:2px}
.reason:active em{color:#22120A;opacity:.7}
.flash{display:grid;place-items:center;text-align:center;min-height:52vh}
.flash svg{width:100px;height:100px}
body[data-side=office]{background:var(--paper);color:var(--paperInk)}
body[data-side=office] header{background:#DCD7C9;border-color:#BDB6A4}
body[data-side=office] .brand{color:#5C6152}
body[data-side=office] .chip{background:#EFEBE0;border-color:#BDB6A4;color:#5C6152}
body[data-side=office] .chip.on{background:var(--paperInk);color:var(--paper);border-color:var(--paperInk)}
.tabs{display:flex;border-bottom:2px solid var(--paperInk);margin-bottom:16px;flex-wrap:wrap}
.tabs button{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
padding:10px 17px;background:none;border:none;cursor:pointer;color:#6D7263}
.tabs button.on{background:var(--paperInk);color:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:8px 10px;
border-bottom:1.5px solid var(--paperInk);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #C9C3B2;vertical-align:top}
td.m,th.m{font-family:var(--mono);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mcard{background:#F2EFE5;border:1px solid #BDB6A4;border-left:6px solid #9AA39B;border-radius:var(--r);padding:13px}
.mcard.run{border-left-color:var(--green)}.mcard.pau{border-left-color:var(--amber)}
.mcard h3{font-family:var(--disp);font-size:19px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.03em}
.mcard .k{font-family:var(--mono);font-size:11px;color:#6D7263}
.mcard .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:6px}
.obtn{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;
border:1.5px solid var(--paperInk);background:none;color:var(--paperInk);border-radius:var(--r);cursor:pointer}
.obtn:active{background:var(--paperInk);color:var(--paper)}
.obtn.pri{background:var(--paperInk);color:var(--paper)}
.obtn.dan{border-color:var(--red);color:var(--red)}
input{font-family:var(--mono);font-size:14px;padding:9px 10px;border:1.5px solid #BDB6A4;border-radius:var(--r);
background:#F7F5EE;color:var(--paperInk);width:100%}
label{display:block;font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6D7263;margin:12px 0 4px}
.note{font-size:13px;color:#6D7263;line-height:1.5;max-width:64ch}
.warn{background:rgba(214,37,42,.16);border-left:4px solid var(--red);padding:12px 14px;border-radius:var(--r);font-size:14px;margin-bottom:16px}
body[data-side=office] .warn{background:rgba(214,37,42,.1)}
.sp{height:14px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#3A3F33;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-side="floor" data-lamp="idle">
<div id="andon"></div>
<div id="app">
  <header>
    <div class="brand">Die&nbsp;<b>Tracker</b></div>
    <div class="spacer"></div>
    <div class="chip" id="netchip"><span class="dot" id="netdot"></span><span id="nettext">…</span></div>
    <div class="chip" id="langchip">EN / हिं</div>
    <div class="chip" id="sidechip">MANAGER</div>
  </header>
  <main id="main"><p class="eyebrow" style="padding:20px">Connecting…</p></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
/* ============================ CONFIG ============================ */
const SUPABASE_URL = "https://kgeetkuzfiynqrwlqesd.supabase.co";
const SUPABASE_KEY = "sb_publishable_rGaZg0I9HlkrExM1Q-_c3A_s2Y-_BIM";
const HISTORY_DAYS = 120;

/* ============================ LOCAL STORE ============================ */
const LS = (()=>{ let mem={};
  const ok=(()=>{try{localStorage.setItem("_t","1");localStorage.removeItem("_t");return true}catch(e){return false}})();
  return { get:k=>{try{return ok?localStorage.getItem(k):mem[k]}catch(e){return mem[k]}},
           set:(k,v)=>{try{ok?localStorage.setItem(k,v):mem[k]=v}catch(e){mem[k]=v}} };})();
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():"x"+Date.now()+Math.random().toString(36).slice(2));
let DEVICE_ID = LS.get("dt:device") || (()=>{const v="dev-"+uuid().slice(0,8);LS.set("dt:device",v);return v})();

/* ============================ STATE ============================ */
let sb=null, STAGES=[], MACHINES=[], DIES=[], EVENTS=[], QUEUE=[];
let online=navigator.onLine, ready=false, dbErr=null;
let lang=LS.get("dt:lang")||"en", side="floor", operator=LS.get("dt:op")||"Team";
let V={view:"home",target:null,mach:null,die:null,pad:"",flash:null,tab:"machines",err:null,showOthers:false,pickN:null};
let track=null, zx=null, detector=null, scanLoop=null;

const REASONS=[{id:"H01",en:"No machine",hi:"मशीन नहीं"},{id:"H02",en:"Crane / shifting",hi:"क्रेन"},
{id:"H03",en:"No program",hi:"प्रोग्राम नहीं"},{id:"H04",en:"No tooling",hi:"टूल नहीं"},
{id:"H07",en:"Press busy",hi:"प्रेस व्यस्त"},{id:"H09",en:"Customer hold",hi:"ग्राहक"}];
const OPERATORS=["Team","OP01 Ramesh","OP02 Suresh","OP03 Anil","OP04 Vikram","OP05 Dinesh"];
const T={scan:{en:"Scan",hi:"स्कैन करें"},scanAny:{en:"Scan die or machine",hi:"डाई या मशीन स्कैन करें"},
start:{en:"Start",hi:"शुरू करें"},end:{en:"Finish",hi:"पूरा हुआ"},pause:{en:"Hold",hi:"रोकें"},
resume:{en:"Resume",hi:"फिर शुरू"},running:{en:"Running now",hi:"चल रहा है"},
nothing:{en:"Nothing running",hi:"कुछ नहीं चल रहा"},keypad:{en:"Type code",hi:"कोड लिखें"},
cancel:{en:"Cancel",hi:"रद्द करें"},needDie:{en:"Now scan the die",hi:"अब डाई स्कैन करें"},
needMach:{en:"Now scan the machine",hi:"अब मशीन स्कैन करें"},why:{en:"Why has it stopped?",hi:"क्यों रुका है?"},
onhold:{en:"On hold",hi:"रुका हुआ"},whichOp:{en:"Which operation?",hi:"कौन सा काम?"},
others:{en:"Others",hi:"अन्य"},back:{en:"Back",hi:"वापस"}};
const t=k=>T[k]?(T[k][lang]||T[k].en):k;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=v=>String(v||"").trim().toUpperCase();

const S=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={scan:S('<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>'),
play:S('<path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/>'),
stop:S('<rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor" stroke="none"/>'),
pause:S('<rect x="7" y="4" width="3.5" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="13.5" y="4" width="3.5" height="16" rx="1" fill="currentColor" stroke="none"/>'),
tick:S('<circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6"/>'),
back:S('<path d="M15 18l-6-6 6-6"/>'),key:S('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/>')};

/* ============================ DATA LAYER ============================ */
const rowToEvent=r=>({id:r.id,cid:r.client_event_id,ts:new Date(r.ts).getTime(),type:r.type,
  die:r.die_code,machine:r.machine_code,stage:r.stage_no,sug:r.suggested_stage_no,
  reason:r.reason,by:r.operator,dev:r.device_id});

async function connect(){
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:5}}});
    const since=new Date(Date.now()-HISTORY_DAYS*864e5).toISOString();
    const [st,mc,di,ev]=await Promise.all([
      sb.from("stages").select("*").order("no"),
      sb.from("machines").select("*").order("code"),
      sb.from("dies").select("*").order("code"),
      sb.from("events").select("*").gte("ts",since).order("ts")]);
    for(const r of [st,mc,di,ev]) if(r.error) throw r.error;
    STAGES=st.data.map(s=>({n:s.no,name:s.name,other:!!s.is_other}));
    MACHINES=mc.data; DIES=di.data; EVENTS=ev.data.map(rowToEvent);
    LS.set("dt:cache",JSON.stringify({STAGES,MACHINES,DIES,EVENTS}));
    sb.channel("ev").on("postgres_changes",
      {event:"INSERT",schema:"public",table:"events"},p=>{
        const e=rowToEvent(p.new);
        if(!EVENTS.some(x=>x.id===e.id||(e.cid&&x.cid===e.cid))){EVENTS.push(e);render();}
      }).subscribe();
    dbErr=null; ready=true;
  }catch(e){
    dbErr=e.message||String(e);
    const c=LS.get("dt:cache");
    if(c){const d=JSON.parse(c);STAGES=d.STAGES;MACHINES=d.MACHINES;DIES=d.DIES;EVENTS=d.EVENTS;ready=true;}
  }
  QUEUE=JSON.parse(LS.get("dt:queue")||"[]");
  flush(); render();
}
const saveQueue=()=>LS.set("dt:queue",JSON.stringify(QUEUE));

async function pushEvent(o){
  const cid=uuid();
  const row={type:o.type,die_code:o.die,machine_code:o.machine,stage_no:o.stage,
    suggested_stage_no:o.sug??null,reason:o.reason??null,operator:operator,
    device_id:DEVICE_ID,client_event_id:cid,device_ts:new Date().toISOString()};
  EVENTS.push({id:"local-"+cid,cid,ts:Date.now(),type:o.type,die:o.die,machine:o.machine,
    stage:o.stage,sug:o.sug,reason:o.reason,by:operator,dev:DEVICE_ID});
  QUEUE.push(row); saveQueue(); flush();
}
let flushing=false;
async function flush(){
  if(flushing||!sb||!QUEUE.length||!navigator.onLine) return;
  flushing=true;
  while(QUEUE.length){
    const row=QUEUE[0];
    try{
      const {error}=await sb.from("events").insert(row);
      if(error && error.code!=="23505") throw error;
      QUEUE.shift(); saveQueue();
    }catch(e){ dbErr=e.message||String(e); break; }
  }
  flushing=false; paintNet();
}
window.addEventListener("online",()=>{online=true;flush();paintNet()});
window.addEventListener("offline",()=>{online=false;paintNet()});
setInterval(flush,15000);

function paintNet(){
  const dot=document.getElementById("netdot"),tx=document.getElementById("nettext"),
        chip=document.getElementById("netchip");
  if(!dot) return;
  if(QUEUE.length){dot.className="dot wait";tx.textContent="QUEUE "+QUEUE.length;chip.className="chip";}
  else if(!navigator.onLine){dot.className="dot off";tx.textContent="OFFLINE";chip.className="chip bad";}
  else if(dbErr){dot.className="dot off";tx.textContent="DB ERROR";chip.className="chip bad";}
  else {dot.className="dot";tx.textContent="LIVE";chip.className="chip";}
}

/* ============================ DOMAIN ============================ */
const stageName=n=>{const s=STAGES.find(x=>x.n===n);return s?s.name:""};
const PRIMARY=()=>STAGES.filter(s=>!s.other);
const OTHERS=()=>STAGES.filter(s=>s.other);
const machineBy=v=>MACHINES.find(m=>norm(m.code)===norm(v));
const dieBy=v=>DIES.find(d=>norm(d.code)===norm(v));
function runOf(mCode){
  const evs=EVENTS.filter(e=>e.machine===mCode).sort((a,b)=>a.ts-b.ts);
  let r=null;
  for(const e of evs){
    if(e.type==="START")r={die:e.die,stage:e.stage,ts:e.ts,by:e.by,paused:false,reason:null};
    else if(e.type==="END")r=null;
    else if(e.type==="PAUSE"&&r){r.paused=true;r.reason=e.reason}
    else if(e.type==="RESUME"&&r){r.paused=false;r.reason=null}
  }
  return r;
}
const openRuns=()=>MACHINES.map(m=>({m,r:runOf(m.code)})).filter(x=>x.r);
const stageDone=(die,n)=>EVENTS.some(e=>e.type==="END"&&e.die===die&&e.stage===n);
const runningElsewhere=die=>openRuns().find(x=>x.r.die===die);
function suggestStage(d){const s=PRIMARY().find(st=>!stageDone(d,st.n));return s?s.n:null}
function dieState(code){
  const run=runningElsewhere(code);
  if(run)return{state:run.r.paused?"paused":"running",mach:run.m,stage:run.r.stage,ts:run.r.ts,next:suggestStage(code)};
  const done=STAGES.filter(s=>stageDone(code,s.n));
  const evs=EVENTS.filter(e=>e.die===code).sort((a,b)=>b.ts-a.ts);
  return{state:evs.length?"waiting":"new",stage:done.length?done[done.length-1].n:null,
    next:suggestStage(code),last:evs[0]?evs[0].ts:null};
}
function el(ms){const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),
  h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  if(d)return d+"d "+h+"h"; if(h)return h+"h "+m+"m"; return m+"m"}
const stamp=ts=>new Date(ts).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:false});

/* ============================ SCANNER ============================ */
async function startCam(){
  stopCam();
  const vid=document.getElementById("video"); if(!vid) return;
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}}); }
  catch(e){ return setErr("Camera blocked. Needs https and permission. Use TYPE CODE."); }
  track=stream; vid.srcObject=stream; try{ await vid.play(); }catch(e){}
  if("BarcodeDetector" in window){
    try{
      detector=new window.BarcodeDetector({formats:["qr_code","code_128","data_matrix","code_39","ean_13"]});
      scanLoop=setInterval(async()=>{
        if(!detector||!vid.videoWidth) return;
        try{const h=await detector.detect(vid); if(h&&h.length){const v=h[0].rawValue.trim();stopCam();onScan(v)}}catch(_){}
      },300);
      return;
    }catch(e){ detector=null; }
  }
  if(window.ZXing){
    try{
      zx=new ZXing.BrowserMultiFormatReader();
      zx.decodeFromStream(stream,vid,(res)=>{ if(res){const v=res.getText().trim();stopCam();onScan(v)} });
      return;
    }catch(e){}
  }
  setErr("Scanner unavailable on this device. Use TYPE CODE.");
}
function stopCam(){
  clearInterval(scanLoop); scanLoop=null; detector=null;
  if(zx){try{zx.reset()}catch(e){} zx=null;}
  if(track){track.getTracks().forEach(t=>t.stop()); track=null;}
}
function setErr(m){V.err=m;render()}

/* ============================ FLOW ============================ */
function onScan(raw){
  V.err=null;
  const m=machineBy(raw), d=dieBy(raw);
  if(m) return pickMachine(m);
  if(d) return pickDie(d);
  V.err="Code not recognised: "+raw; V.view="scan"; render();
}
function pickMachine(m){
  V.mach=m; const r=runOf(m.code);
  if(r){V.die=DIES.find(d=>d.code===r.die)||{code:r.die,part:"—",customer:"—"};V.view="running"}
  else if(V.die){V.showOthers=false;V.view="operation"}
  else {V.target="die";V.view="scan"}
  render();
}
function pickDie(d){
  V.die=d;
  if(V.mach){ const r=runOf(V.mach.code);
    if(r){V.view="running"} else {V.showOthers=false;V.view="operation"} }
  else {V.target="machine";V.view="scan"}
  render();
}
function doStart(n){
  const other=runningElsewhere(V.die.code);
  if(other){V.err="Die "+V.die.code+" is already running on "+other.m.code+" "+other.m.name+". Finish it there first.";
    V.view="operation";return render()}
  pushEvent({type:"START",die:V.die.code,machine:V.mach.code,stage:n,sug:suggestStage(V.die.code)});
  flash("start",n);
}
function doEnd(){
  const r=runOf(V.mach.code); if(!r)return;
  if(r.paused) pushEvent({type:"RESUME",die:r.die,machine:V.mach.code,stage:r.stage});
  pushEvent({type:"END",die:r.die,machine:V.mach.code,stage:r.stage});
  flash("end",r.stage);
}
function doPause(x){
  const r=runOf(V.mach.code);
  pushEvent({type:"PAUSE",die:r.die,machine:V.mach.code,stage:r.stage,reason:x.id+" "+x.en});
  flash("pause",r.stage);
}
function doResume(){
  const r=runOf(V.mach.code);
  pushEvent({type:"RESUME",die:r.die,machine:V.mach.code,stage:r.stage});
  V.view="running";render();
}
function flash(kind,n){
  V.flash={kind,stage:n,die:V.die.code,mach:V.mach.code+" "+V.mach.name};
  V.view="flash";render();
  setTimeout(()=>{V.mach=null;V.die=null;V.target=null;V.flash=null;V.showOthers=false;V.view="home";render()},2400);
}
function home(){stopCam();V={...V,view:"home",mach:null,die:null,target:null,pad:"",err:null,showOthers:false};render()}
function lamp(){
  if(side==="office")return"office";
  if(V.view==="flash")return V.flash.kind==="pause"?"paused":"ok";
  if(V.err||dbErr)return"alert";
  if(V.view==="running"){const r=runOf(V.mach.code);return r&&r.paused?"paused":"running"}
  const a=openRuns();
  if(a.some(x=>x.r.paused))return"paused";
  return a.length?"running":"idle";
}

function csv(){
  const h=["event_id","timestamp_iso","timestamp_local","type","die_code","machine_code","machine_name",
    "stage_no","stage_name","suggested_stage","reason","operator","device"];
  const rows=[...EVENTS].sort((a,b)=>a.ts-b.ts).map(e=>[e.id,new Date(e.ts).toISOString(),stamp(e.ts),e.type,
    e.die||"",e.machine||"",(machineBy(e.machine)||{}).name||"",e.stage||"",stageName(e.stage),
    e.sug||"",e.reason||"",e.by||"",e.dev||""]);
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const txt=[h.map(q).join(","),...rows.map(r=>r.map(q).join(","))].join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+txt],{type:"text/csv;charset=utf-8"}));
  a.download="die_events_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();a.remove();
}

function bind(){
  document.querySelectorAll("[data-a]").forEach(n=>n.onclick=()=>act(n.dataset));
  if(V.view==="scan"&&side==="floor"&&!track) startCam();
  document.querySelectorAll("input").forEach(i=>i.onclick=e=>e.stopPropagation());
}
async function act(d){
  const a=d.a;
  if(a!=="key") V.err=null;
  switch(a){
    case "scan":V.target=null;V.view="scan";render();break;
    case "pad":stopCam();V.pad="";V.view="pad";render();break;
    case "home":home();break;
    case "open":pickMachine(machineBy(d.m));break;
    case "more":V.showOthers=true;render();break;
    case "less":V.showOthers=false;render();break;
    case "op":V.pickN=+d.n;V.view="confirm";render();break;
    case "backop":V.view="operation";render();break;
    case "confirmstart":doStart(V.pickN);break;
    case "end":doEnd();break;
    case "pausemenu":V.view="pausemenu";render();break;
    case "back-run":V.view="running";render();break;
    case "reason":doPause(REASONS[+d.i]);break;
    case "resume":doResume();break;
    case "oper":V.view="oper";render();break;
    case "setoper":operator=d.o;LS.set("dt:op",operator);home();break;
    case "key":
      if(d.k==="C")V.pad=V.pad.slice(0,-1);
      else if(d.k==="OK"){const p=V.pad;V.pad="";if(p)return onScan(p)}
      else if(V.pad.length<12)V.pad+=d.k;
      render();break;
    case "tab":V.tab=d.t;render();break;
    case "csv":csv();break;
    case "force":{
      const r=runOf(d.m); if(!r)return;
      if(!confirm("Force finish "+r.die+" on "+d.m+"?")) return;
      if(r.paused) await pushEvent({type:"RESUME",die:r.die,machine:d.m,stage:r.stage});
      await pushEvent({type:"END",die:r.die,machine:d.m,stage:r.stage,reason:"Force closed by supervisor"});
      render(); break;
    }
    case "adddie":{
      const g=i=>(document.getElementById(i)||{}).value||"";
      const code=norm(g("nd_code")); if(!code) return alert("Die code required.");
      if(dieBy(code)) return alert("That die already exists.");
      const rec={code,customer:g("nd_cust").trim(),part:g("nd_part").trim()};
      const {error}=await sb.from("dies").insert(rec);
      if(error) return alert("Could not add die: "+error.message+
        "\n\nAdd an insert policy on dies, or use the Supabase table editor.");
      DIES.push(rec); V.tab="dies"; render(); break;
    }
  }
}

document.getElementById("langchip").onclick=()=>{
  lang=lang==="en"?"hi":"en"; LS.set("dt:lang",lang);
  document.getElementById("langchip").classList.toggle("on",lang==="hi"); render()};
document.getElementById("sidechip").onclick=()=>{
  stopCam(); side=side==="floor"?"office":"floor";
  V={...V,view:"home",mach:null,die:null,target:null,err:null,showOthers:false}; render()};
setInterval(()=>{ if(!ready)return;
  if(side==="floor"&&(V.view==="home"||V.view==="running"))render();
  else if(side==="office"&&(V.tab==="machines"||V.tab==="dies"))render()},30000);
window.addEventListener("pagehide",stopCam);

if("serviceWorker" in navigator)
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));

connect();
</script>
</body>
</html>
